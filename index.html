<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotcha Machine</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="ambientBg" class="ambient-bg" aria-hidden="true"></div>

<div class="app">
  <header class="app-header">
    <button id="muteBtn" class="mute-btn" aria-label="Toggle sound" title="Toggle sound"></button>
    <p class="eyebrow">Gotcha Platform</p>
    <h1>GOTCHA MACHINE</h1>
  </header>

  <main>

    <!-- SCREEN 1: category select -->
    <section id="screen-category" class="screen active">
      <div id="playerBar" class="player-bar">
        <button id="bestPullStat" class="player-stat hidden"></button>
      </div>

      <h2 class="screen-title">Choose your prize tier</h2>
      <div id="categoryList" class="category-list"></div>

      <div id="recentPulls" class="recent-pulls hidden">
        <h3>Your Recent Pulls</h3>
        <div id="recentPullsList" class="recent-pulls-list"></div>
      </div>
    </section>

    <!-- SCREEN 2: reel + boxes + reveal -->
    <section id="screen-game" class="screen">
      <div class="game-top-bar">
        <button id="backBtn" class="back-btn">&larr; Change tier</button>
        <span id="creditsMini" class="credits-mini hidden"></span>
      </div>
      <h2 class="screen-title" id="gameTierLabel"></h2>

      <div id="reel" class="reel">
        <div id="reelTrack" class="reel-track"></div>
        <div class="reel-slot-lines">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div id="boxRow" class="box-row hidden">
        <div class="box-slot" data-index="0">
          <div class="price-card">
            <span class="price-card-rarity"></span>
            <img class="price-card-image" alt="">
            <span class="price-card-name"></span>
            <span class="price-card-price"></span>
          </div>
          <canvas class="box-canvas"></canvas>
          <div class="box-caption">Crate 1</div>
          <div class="near-miss-tag hidden"></div>
        </div>
        <div class="box-slot" data-index="1">
          <div class="price-card">
            <span class="price-card-rarity"></span>
            <img class="price-card-image" alt="">
            <span class="price-card-name"></span>
            <span class="price-card-price"></span>
          </div>
          <canvas class="box-canvas"></canvas>
          <div class="box-caption">Crate 2</div>
          <div class="near-miss-tag hidden"></div>
        </div>
        <div class="box-slot" data-index="2">
          <div class="price-card">
            <span class="price-card-rarity"></span>
            <img class="price-card-image" alt="">
            <span class="price-card-name"></span>
            <span class="price-card-price"></span>
          </div>
          <canvas class="box-canvas"></canvas>
          <div class="box-caption">Crate 3</div>
          <div class="near-miss-tag hidden"></div>
        </div>
      </div>

      <p id="helperText" class="helper-text hidden">Tap a crate to open it</p>
      <button id="playAgainBtn" class="primary-btn hidden">Open Again</button>
    </section>

  </main>

  <footer class="app-footer">
    <p>
      3D "Nike Shoe Box" by
      <a href="https://sketchfab.com/samplemem" target="_blank" rel="noopener">samplemem</a>,
      licensed
      <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.
      Prize catalog images from
      <a href="https://odto.com/collections/footwear" target="_blank" rel="noopener">odto.com</a>.
    </p>
  </footer>
</div>

<!-- Won-prize hero modal -->
<div id="prizeModal" class="prize-modal hidden">
  <div class="reveal-fx"></div>
  <div class="reveal-rarity-banner"><span></span></div>
  <div class="prize-modal-card">
    <span class="prize-modal-rarity"></span>
    <div class="prize-modal-content">
      <img class="prize-modal-image" alt="">
      <h3 class="prize-modal-name"></h3>
      <p class="prize-modal-price"></p>
      <span id="streakBadge" class="streak-badge hidden"></span>
      <div class="prize-modal-actions">
        <button id="cashBackBtn" class="modal-btn modal-btn-outline">Cash Back</button>
        <button id="keepBtn" class="modal-btn modal-btn-solid">Keep</button>
      </div>
    </div>
  </div>
</div>

<!-- Credit-earned toast -->
<div id="creditToast" class="credit-toast hidden">
  <span class="credit-toast-icon">&#128276;</span>
  <span id="creditToastText"></span>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
