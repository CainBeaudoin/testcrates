<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .mark { stroke: #1c1813; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #ffffff; } }
  </style>
  <!-- The footer's hexagon, strokes thickened to hold up at 16px. -->
  <g class="mark" fill="none" stroke-linejoin="round">
    <polygon points="50,6 92,28 92,72 50,94 8,72 8,28" stroke-width="10"/>
    <line x1="50" y1="6" x2="50" y2="94" stroke-width="9"/>
  </g>
</svg>
