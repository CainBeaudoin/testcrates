const rr=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r);};
function glyph(x,kind,cx,cy,r,col="#fff"){

function orb(x,type,cx,cy,r){

    x.font='500 20px Archivo';wrap(x,m.text,W-tx-(m.dmg?130:60)).slice(0,2).forEach((l,k)=>x.fillText(l,tx,top+53+k*24));

  });

  const RY=H-164;
  x.strokeStyle=c.type==="dark"?"rgba(255,255,255,.22)":"rgba(0,0,0,.2)";x.lineWidth=2;x.beginPath();x.moveTo(54,RY-16);x.lineTo(W-54,RY-16);x.stroke();
  x.fillStyle=t.ink;x.font='700 17px Archivo';x.fillText("weakness",56,RY+8);orb(x,c.weak,160,RY+2,14);x.fillText("×2",180,RY+8);
  x.fillText("retreat",W-210,RY+8);for(let k=0;k<Math.min(3,Math.ceil(c.hp/70));k++){x.fillStyle="#fff";x.beginPath();x.arc(W-136+k*30,RY+2,12,0,7);x.fill();x.strokeStyle="rgba(0,0,0,.35)";x.lineWidth=2;x.stroke();}

const RARITIES={common:["#B9B9BE","COMMON"],uncommon:["#4ADE80","UNCOMMON"],rare:["#4FA3F7","RARE"],epic:["#B678F2","EPIC"],legendary:["#F2B84B","GRAIL"]};
// The back of a Chosen card, framed in its rarity's colour.
function drawBack(rarity){
  const [col,label]=RARITIES[rarity];
  const can=document.createElement("canvas");can.width=W;can.height=H;const x=can.getContext("2d");
  rr(x,0,0,W,H,38);x.clip();x.fillStyle=col;x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,H/2,40,W/2,H/2,660);g.addColorStop(0,"#26262e");g.addColorStop(.6,"#121217");g.addColorStop(1,"#08080b");
  rr(x,30,30,W-60,H-60,16);x.save();x.fillStyle=g;x.fill();x.clip();
  x.translate(W/2,H/2);x.strokeStyle=col;x.globalAlpha=.17;x.lineWidth=18;for(let i=0;i<14;i++){x.rotate(Math.PI/7);x.beginPath();x.moveTo(70,0);x.quadraticCurveTo(270,130,660,40);x.stroke();}x.restore();

  x.beginPath();x.arc(W/2,H/2,178,0,7);x.fillStyle=col;x.fill();x.beginPath();x.arc(W/2,H/2,160,0,7);x.fillStyle="#0c0c10";x.fill();

  x.fillStyle=col;x.font='900 30px "Archivo Black"';x.fillText(label,W/2,H-92);x.fillText(label,W/2,118);

}
async function post(name,canvas,type="image/webp",q=.9){const b=await new Promise(r=>canvas.toBlob(r,type,q));const res=await fetch(`/save?name=${name}`,{method:"POST",body:b});return `${name} ${res.status} ${(b.size/1024)|0}KB`;}
window.makeCards=async()=>{const o=[];const out=document.getElementById("out");out.innerHTML="";for(const c of CARDS){const can=await drawCard(c);out.appendChild(can);o.push(await post(`${c.id}.webp`,can));}for(const r of Object.keys(RARITIES)){const b=drawBack(r);out.appendChild(b);o.push(await post(`back-${r}.webp`,b));}return o;};
// ---- The cube's faces: black board, card backs, a lot of tape ----
const F=1024;
function board(x){
  x.fillStyle="#0d0d11";x.fillRect(0,0,F,F);
  for(let i=0;i<F;i+=14){x.fillStyle="rgba(255,255,255,.012)";x.fillRect(i,0,7,F);}
  let n=11;const r=()=>(n=(n*16807)%2147483647)/2147483647;
  for(let i=0;i<60;i++){const a=r()*F,b=r()*F,q=40+r()*150;const g=x.createRadialGradient(a,b,0,a,b,q);g.addColorStop(0,`rgba(255,255,255,${r()<.5?.02:.0})`);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(a-q,b-q,q*2,q*2);}
}
function stick(x,card,cx,cy,w,deg){
  const h=w*1.4;x.save();x.translate(cx,cy);x.rotate(deg*Math.PI/180);x.shadowColor="rgba(0,0,0,.6)";x.shadowBlur=14;x.shadowOffsetY=5;x.drawImage(card,-w/2,-h/2,w,h);x.restore();

// A strip of packing tape: glossy, printed, torn a little at the ends.
function tape(x,cx,cy,len,wd,deg,col,ink,text="SEALED · CHOSEN · "){
  x.save();x.translate(cx,cy);x.rotate(deg*Math.PI/180);
  x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=8;x.shadowOffsetY=3;x.fillStyle=col;

const RED=["#d8232f","rgba(70,0,6,.8)"],GOLD=["#f2b84b","rgba(70,42,0,.82)"],WHITE=["#ece9e2","rgba(20,20,24,.8)"];

function drawFaces(){
  const b=Object.fromEntries(Object.keys(RARITIES).map(r=>[r,drawBack(r)]));
  const face=(fn)=>{const c=document.createElement("canvas");c.width=c.height=F;const x=c.getContext("2d");board(x);fn(x);return c;};

    stick(x,b.rare,228,232,270,-12);stick(x,b.legendary,800,222,280,10);stick(x,b.uncommon,226,800,270,8);stick(x,b.epic,800,806,280,-9);
    tape(x,F/2,F/2,F+40,150,0,...GOLD);tape(x,F/2,F/2,F+40,132,90,...RED);tape(x,F/2,F/2,F*1.5,72,45,...WHITE,"FRAGILE · CARDS · ");tape(x,F/2,F/2,F*1.5,72,-45,...WHITE,"FRAGILE · CARDS · ");
    x.save();x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=12;x.beginPath();x.arc(F/2,F/2,118,0,7);x.fillStyle="#d8232f";x.fill();x.restore();x.beginPath();x.arc(F/2,F/2,100,0,7);x.strokeStyle="#fff";x.lineWidth=5;x.stroke();x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.font='900 40px "Archivo Black"';x.fillText("SEALED",F/2,F/2+2);
  });

}
window.makeFaces=async()=>{const f=drawFaces();const out=document.getElementById("out");out.innerHTML="";Object.values(f).forEach(c=>out.appendChild(c));return[await post("cube-side-a.webp",f.sideA,"image/webp",.88),await post("cube-side-b.webp",f.sideB,"image/webp",.88),await post("cube-top.webp",f.top,"image/webp",.88)];};
