<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CHOSEN — Phone Spot</title>
<!--
  The phone spot: the real mobile site (screen.webm, recorded by record.py)
  plays on a 3D iPhone 17 Pro, a cursor taps through Drops → Open → Keep →
  Account → Ship, then the phone is set down, the lock screen gets the
  delivery notification, the CHOSEN box drops onto the screen and opens, and
  the AJ1 '85 floats out of it.

  Every pixel is a pure function of time: window.renderFrame(t) (async, it
  seeks the recording) poses everything for second t, so ../render.py can
  capture it at any fps. Open directly to scrub: space, ←/→, shift, ?t=40.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=block">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root {
  --paper: #f6f4ef;
  --text: #121212;
  --dim: rgba(18, 18, 18, 0.55);
  --gold: #F2B84B;
  --green: #9EF58A;
}
html, body { margin: 0; background: #000; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
  color: var(--text); font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
  transform-origin: 0 0;
  background: radial-gradient(ellipse 80% 90% at 55% 45%, #ffffff 0%, var(--paper) 60%, #ebe7df 100%);
}
/* colour: a soft glow behind the subject that changes hue every chapter */
#orb { width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; filter: blur(40px); }
/* a huge outlined chapter word crawling behind everything, old-catalog style */
#bigword {
  position: absolute; left: 0; top: 50%; white-space: nowrap; font-family: Anton, Impact, sans-serif;
  font-size: 520px; line-height: 1; text-transform: uppercase; color: transparent;
  -webkit-text-stroke: 3px rgba(18, 18, 18, 0.1); letter-spacing: 0.01em; will-change: transform, opacity;
}
/* film grain over the whole frame */
#grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: 0.08; pointer-events: none; }
#gl, #fx, #fxb { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }

.cap { position: absolute; left: 150px; top: 0; }
/* the chapter label is a sticker: a black pill, slapped on at an angle */
.cap .chip {
  font: 800 21px Inter; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,.6);
  display: inline-flex; gap: 12px; align-items: center; margin-bottom: 30px;
  background: #121212; padding: 12px 22px 12px 20px; border-radius: 999px;
  box-shadow: 0 8px 20px rgba(0,0,0,.18); transform-origin: 0 50%;
}
.cap .chip i { display: none; }
.cap .chip b { color: #fff; font-weight: 800; }
.cap .chip b.gold { color: var(--gold); }
.cap .hl { font-family: Anton, Impact, sans-serif; text-transform: uppercase; line-height: 0.9; font-size: 168px; letter-spacing: 0.005em; }
.cap .hl.sm { font-size: 104px; line-height: 0.95; }
.cap .ln { display: block; white-space: nowrap; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.035em; margin: 0 -0.035em; }
.w > span { display: inline-block; will-change: transform; }
/* accent words get a highlighter swipe */
.hl .gold, .hl .green, .hl .red {
  background: linear-gradient(transparent 38%, var(--hc) 38%, var(--hc) 76%, transparent 76%);
  background-size: var(--swipe, 100%) 100%; background-repeat: no-repeat; padding: 0 0.05em;
}
.hl .gold { --hc: var(--gold); }
.hl .green { --hc: var(--green); }
.hl .red { --hc: #FF7A7A; }
.hl .blue { --hc: #8ED0FF; }
.hl .violet { --hc: #C3A6FF; }
.hl .blue, .hl .violet {
  background: linear-gradient(transparent 38%, var(--hc) 38%, var(--hc) 76%, transparent 76%);
  background-size: var(--swipe, 100%) 100%; background-repeat: no-repeat; padding: 0 0.05em;
}
.cap .sub { font: 600 26px Inter; color: var(--dim); margin-top: 30px; letter-spacing: 0.02em; }
.cap .sub b { color: var(--text); }

#bell { width: 150px; height: 150px; margin: -75px 0 0 -75px; }
#bell .disc {
  position: absolute; inset: 0; border-radius: 50%; background: var(--gold);
  box-shadow: 0 18px 40px rgba(0,0,0,.18), 0 0 60px rgba(242,184,75,.5);
  display: flex; align-items: center; justify-content: center;
}
#bell svg { width: 78px; height: 78px; transform-origin: 50% 12%; }
#bell .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--gold); }
#bell .badge {
  position: absolute; right: -4px; top: -4px; width: 46px; height: 46px; border-radius: 50%;
  background: #e5484d; color: #fff; font: 800 24px Inter; display: flex; align-items: center; justify-content: center;
  border: 4px solid var(--paper);
}

/* reveal HUD: a black tag with the brand green, and brackets that lock onto the shoe */
#hud {
  width: 560px; padding: 22px 28px 20px 34px; background: rgba(14,14,14,.92); color: #f4f2ee; border-radius: 6px;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); border-left: 8px solid var(--green); overflow: hidden;
}
#hud .lab { font: 700 17px "Space Mono", monospace; letter-spacing: .08em; color: var(--green); padding-bottom: 12px; border-bottom: 2px solid rgba(158,245,138,.5); }
#hud .lab .leg { color: var(--gold); }
#hud .nm { font: 46px Anton, Impact, sans-serif; letter-spacing: .01em; margin-top: 14px; line-height: 1; }
#hud .nm2 { font: 46px Anton, Impact, sans-serif; letter-spacing: .01em; color: #FF6B6B; line-height: 1.05; }
#hud .ft { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 12px; border-top: 2px solid rgba(158,245,138,.5); font: 700 17px "Space Mono", monospace; letter-spacing: .08em; color: rgba(244,242,238,.7); }
#hud .ft b { font: 700 44px "Space Mono", monospace; color: var(--green); letter-spacing: 0; }
#brackets { width: 0; height: 0; }
#brackets i { position: absolute; width: 46px; height: 46px; border: 0 solid #121212; }
#brackets i:nth-child(1) { left: 0; top: 0; border-left-width: 5px; border-top-width: 5px; }
#brackets i:nth-child(2) { right: 0; top: 0; border-right-width: 5px; border-top-width: 5px; }
#brackets i:nth-child(3) { left: 0; bottom: 0; border-left-width: 5px; border-bottom-width: 5px; }
#brackets i:nth-child(4) { right: 0; bottom: 0; border-right-width: 5px; border-bottom-width: 5px; }
/* closing tag: a black panel wipes across, the words land with the voice */
#tag { position: absolute; inset: 0; background: #0e0e0e; display: none; }
#tag .edge { position: absolute; top: -10%; bottom: -10%; width: 60px; background: var(--green); }
#tag .txt {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
  font-family: Anton, Impact, sans-serif; text-transform: uppercase; color: #f6f4ef; font-size: 250px; line-height: 0.95;
}
#tag .tw { display: inline-block; will-change: transform, opacity; }
#tag .q { color: #0e0e0e; background: var(--green); padding: 0 0.12em; margin-top: 0.08em; }
#tag .stk {
  position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%) rotate(-3deg);
  font: 800 22px Inter; letter-spacing: .22em; color: #0e0e0e; background: #f6f4ef; padding: 12px 22px; border-radius: 999px;
}
/* light leak: a hot overexposed sweep on the big beats */
#leak { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#fade { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
#scrub { position: fixed; left: 10px; bottom: 8px; font: 12px ui-monospace, monospace; color: #888; z-index: 9; }
body.render #scrub { display: none; }
video { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="orb" class="abs"></div>
  <div id="bigword"></div>
  <canvas id="fxb" width="1920" height="1080"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="caps"></div>
  <div id="bell" class="abs">
    <div class="ring"></div><div class="ring"></div>
    <div class="disc"><svg viewBox="0 0 24 24" fill="#16130f"><path d="M12 2.2c-.8 0-1.4.6-1.4 1.4v.6C7.9 4.9 6 7.3 6 10.2v4.1l-1.6 2.2c-.4.6 0 1.4.7 1.4h13.8c.7 0 1.1-.8.7-1.4L18 14.3v-4.1c0-2.9-1.9-5.3-4.6-6v-.6c0-.8-.6-1.4-1.4-1.4zM9.6 19.4a2.4 2.4 0 0 0 4.8 0z"/></svg></div>
    <div class="badge">1</div>
  </div>
  <div id="brackets" class="abs"><i></i><i></i><i></i><i></i></div>
  <div id="hud" class="abs">
    <div class="lab">CHOSEN&nbsp;&nbsp;/&nbsp;&nbsp;PULL 001&nbsp;&nbsp;/&nbsp;&nbsp;<span class="leg">LEGENDARY</span></div>
    <div class="nm">AIR JORDAN 1 HIGH '85</div>
    <div class="nm2">CHICAGO</div>
    <div class="ft"><span>LAST SALE&nbsp;&nbsp;/&nbsp;&nbsp;USD</span><b id="hudPrice">$895</b></div>
  </div>
  <div id="tag">
    <div class="edge"></div>
    <div class="txt"><span class="tw" id="tw1">Sam</span> <span class="tw" id="tw2">when</span><br><span class="tw q" id="tw3">RWA?</span></div>

  </div>

</div>
<div id="scrub"></div>
<video id="rec" muted playsinline preload="auto"></video>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1920, H = 1080;

// ---------------------------------------------------------------- math ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inC: (x) => x * x * x,
  outC: (x) => 1 - Math.pow(1 - x, 3),
  inOutC: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outBack: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// 0→1 over [a, a+fi], hold, 1→0 over [b-fo, b]
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(E.outC(prog(t, a, a + fi)), 1 - E.inC(prog(t, b - fo, b)));
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ------------------------------------------------------------ timeline ----
const REC = await fetch("taps.json").then((r) => r.json());
const FPS_REC = REC.fps, NREC = Math.round(REC.duration * FPS_REC);
// Speed ramp: the take plays at 1× for a beat around each tap (the press
// reads), through the Legendary flash and on the "Order placed" toast, and at
// FAST× through everything else — loading, typing, waiting. rec time r ↔ output time.
const FAST = 3.4;
const FOCUS = [
  ...REC.taps.map((tp) => [tp.t - 0.3, tp.t + 0.2]),
  [REC.marks.flash - 0.25, REC.marks.flash + 0.9],
  [REC.marks.shipped + 0.2, REC.marks.shipped + 0.9],
];
const RAMP = (() => {
  const cuts = [...new Set([0, REC.duration, ...FOCUS.flat().map((x) => clamp(x, 0, REC.duration))])].sort((a, b) => a - b);
  const segs = [];
  let o = 0;
  for (let i = 0; i + 1 < cuts.length; i++) {
    const a = cuts[i], b = cuts[i + 1], mid = (a + b) / 2;
    const speed = FOCUS.some(([x, y]) => mid > x && mid < y) ? 1 : FAST;
    segs.push({ a, b, o, speed });
    o += (b - a) / speed;
  }
  return { segs, out: o };
})();
function outTime(r) {   // rec time → seconds after REC0
  r = clamp(r, 0, REC.duration);
  const s = RAMP.segs.find((g) => r <= g.b) ?? RAMP.segs[RAMP.segs.length - 1];
  return s.o + (r - s.a) / s.speed;
}
function recTime(u) {   // seconds after REC0 → rec time
  u = clamp(u, 0, RAMP.out);
  const s = RAMP.segs.find((g) => u <= g.o + (g.b - g.a) / g.speed) ?? RAMP.segs[RAMP.segs.length - 1];
  return s.a + (u - s.o) * s.speed;
}
const REC0 = 1.0;                            // the recording starts playing on the phone (after the flip)
const REC_END = REC0 + RAMP.out;             // ends on the "Order placed" tracker
const T_PUT0 = REC_END + 0.05, T_PUT1 = T_PUT0 + 0.9;    // phone is set down flat
const T_SLEEP = T_PUT0 + 0.45;                           // screen goes dark
const T_WAKE = T_PUT1 + 0.12, T_NOTE = T_WAKE + 0.1;     // lock screen, notification
const T_SWIPE0 = T_NOTE + 0.95, T_SWIPE1 = T_SWIPE0 + 0.35; // phone is swiped out of frame
const T_DROP0 = T_SWIPE1 + 0.02, T_LAND = T_DROP0 + 0.45; // box falls onto the bare table
const T_CHARGE = T_LAND + 0.18;
const CHARGE_SPEED = 2.0, OPEN_SPEED = 1.5;              // the crate's baked clips, played faster
let T_OPEN, T_SHOE0, T_SHOE1, T_END0, DURATION;         // set once the box clips are known
let T_LOCK, T_TAG, T_CLEAR;                                            // when the shoe's sole clears the flaps; it doesn't spin or tilt before

// ------------------------------------------------------------ three.js ----
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
{
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
}
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
const key = new THREE.DirectionalLight(0xfff1e0, 2.6);
key.position.set(3.5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
key.shadow.radius = 5;
key.shadow.bias = -0.0005;
const rim = new THREE.DirectionalLight(0xffffff, 1.6);
rim.position.set(-4, 3, -5);
const glow = new THREE.PointLight(0xf2b84b, 0, 7, 1.6);
scene.add(new THREE.AmbientLight(0xffffff, 0.35), key, rim, glow);

// soft contact shadows straight onto the paper backdrop
const floor = new THREE.Mesh(new THREE.PlaneGeometry(26, 26),
  new THREE.ShadowMaterial({ opacity: 0.2, transparent: true, depthWrite: false }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [phoneGltf, boxGltf, shoeGltf] = await Promise.all([
  loader.loadAsync("models/iphone-17-pro.glb"),
  loader.loadAsync("../../assets/models/box-chosen-od.glb"),
  loader.loadAsync("models/aj1-85.glb"),
]);

// ---- phone ------------------------------------------------------------------
const phone = new THREE.Group();
phone.rotation.order = "YXZ"; // yaw is applied in world space, so a flat phone still turns on the table
const phoneModel = phoneGltf.scene;
{
  const b = new THREE.Box3().setFromObject(phoneModel);
  phoneModel.position.sub(b.getCenter(new THREE.Vector3()));
}
phone.add(phoneModel);
scene.add(phone);
phone.updateMatrixWorld(true);
const PHONE = new THREE.Box3().setFromObject(phone).getSize(new THREE.Vector3()); // ≈ 1.98 × 4.05 × 0.28

// The display is a canvas we draw every frame (status bar + recording +
// cursor, later the lock screen). The model's screen UVs point into a rotated
// atlas patch, so re-project them flat across the glass.
const SW = 804, SH = 1678, BAR = 108; // 402×839pt @2x; status bar 54pt
const screenCanvas = document.createElement("canvas");
screenCanvas.width = SW; screenCanvas.height = SH;
const sc = screenCanvas.getContext("2d", { willReadFrequently: true });
const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
phoneModel.traverse((n) => {
  if (!n.isMesh) return;
  n.castShadow = true;
  n.frustumCulled = false;
  if (n.material.name === "Screen_BG") {
    const pos = n.geometry.attributes.position, v = new THREE.Vector3(), pts = [];
    for (let i = 0; i < pos.count; i++) pts.push(v.fromBufferAttribute(pos, i).applyMatrix4(n.matrixWorld).clone());
    const b = new THREE.Box3().setFromPoints(pts);
    const uv = new Float32Array(pos.count * 2);
    pts.forEach((p, i) => { uv[i * 2] = (p.x - b.min.x) / (b.max.x - b.min.x); uv[i * 2 + 1] = (p.y - b.min.y) / (b.max.y - b.min.y); });
    n.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    n.material = new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false });
  }
});

// ---- box (the CHOSEN crate, with its baked Charge / Open clips) ---------------
const boxModel = boxGltf.scene;
const clips = Object.fromEntries(boxGltf.animations.map((c) => [c.name, c]));
boxModel.updateMatrixWorld(true);
const BOX_RY = -0.5; // how the box ends up facing after it lands
const BOX_W = 2.4;   // closed box, long side, in world units
boxModel.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; n.frustumCulled = false; } });
const box = new THREE.Group();
box.add(boxModel);
scene.add(box);
const mixer = new THREE.AnimationMixer(boxModel);
const actions = {};
for (const n of ["Charge", "Open"]) {
  const a = mixer.clipAction(clips[n]);
  a.setLoop(THREE.LoopOnce, 1);
  a.clampWhenFinished = true;
  actions[n] = a;
}
function poseClip(name, ct) {
  for (const [n, a] of Object.entries(actions)) {
    if (n === name) { a.enabled = true; a.setEffectiveWeight(1); a.play(); a.time = clamp(ct, 0, a.getClip().duration - 1e-4); }
    else { a.enabled = false; a.stop(); }
  }
  mixer.update(0);
}
// Size and centre the crate from its posed (closed) geometry: it's skinned,
// so the rest-pose bounds of "CrateBody" say nothing about its real shape.
poseClip("Open", 0);
let fit = preciseBox(boxModel);
boxModel.scale.multiplyScalar(BOX_W / Math.max(fit.max.x - fit.min.x, fit.max.z - fit.min.z));
fit = preciseBox(boxModel);
boxModel.position.x -= (fit.min.x + fit.max.x) / 2;
boxModel.position.z -= (fit.min.z + fit.max.z) / 2;
boxModel.position.y -= fit.min.y;
fit = preciseBox(boxModel);
const BOX_H = fit.max.y - fit.min.y;
const BOX_LONG_X = fit.max.x - fit.min.x >= fit.max.z - fit.min.z; // the shoe lies along the long side
T_OPEN = T_CHARGE + clips.Charge.duration / CHARGE_SPEED;
T_SHOE0 = T_OPEN + 0.12;
T_SHOE1 = T_SHOE0 + 1.1;
T_LOCK = T_SHOE1 - 0.35; // the HUD brackets snap onto the shoe
T_END0 = T_SHOE1 + 1.9;
T_TAG = T_END0 + 1.6;    // the closing tag: "Sam when RWA?" (voice-tag.wav starts at T_TAG + 0.15)
DURATION = T_TAG + 2.5;
window.DURATION = DURATION;

// ---- shoe ---------------------------------------------------------------------
const shoe = new THREE.Group();
const shoeModel = shoeGltf.scene;
{
  const b = new THREE.Box3().setFromObject(shoeModel), s = b.getSize(new THREE.Vector3());
  const k = 1.95 / s.x; // heel-to-toe, in world units; fits inside the 2.4 box
  shoeModel.scale.setScalar(k);
  shoeModel.position.copy(b.getCenter(new THREE.Vector3()).multiplyScalar(-k));
}
shoeModel.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.frustumCulled = false; n.material.envMapIntensity = 1.1; } });
shoe.add(shoeModel);
scene.add(shoe);

// Vertex-exact world bounds (the crate's flaps are skinned, so its plain
// Box3 is the rest pose, not the opened one).
function preciseBox(root) {
  const b = new THREE.Box3(), v = new THREE.Vector3();
  root.updateMatrixWorld(true);
  root.traverse((n) => {
    if (!n.isMesh || !n.visible) return;
    const pos = n.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      if (n.isSkinnedMesh) n.applyBoneTransform(i, v);
      b.expandByPoint(v.applyMatrix4(n.matrixWorld));
    }
  });
  return b;
}
// half the shoe's height, plus what its float tilt can add
const SHOE_HH = (() => { const s = new THREE.Box3().setFromObject(shoeModel).getSize(new THREE.Vector3()); return s.y / 2 + 0.09 * s.x / 2; })();
const SHOE_CLEAR = 0.45;     // gap between the sole and the flap tips once it's out
const SHOE_CAM_Y = 2.3, SHOE_LOOK_Y = 1.62; // tuned with window.__overlap (below)

const FLAT = { x: 0, y: PHONE.z / 2, z: 0.15, rx: -Math.PI / 2, ry: 0.12, rz: 0 };
const BOX_BASE = new THREE.Vector3(0, 0, 0.2);
// the open box's highest point: the tips of the flaps
box.position.copy(BOX_BASE); box.rotation.set(0, BOX_RY, 0); box.scale.setScalar(1);
poseClip("Open", clips.Open.duration);
const FLAP_TOP = preciseBox(boxModel).max.y;
T_CLEAR = T_SHOE0;
while (T_CLEAR < T_SHOE1 && shoeY(T_CLEAR) - SHOE_HH < FLAP_TOP + 0.03) T_CLEAR += 1 / 120;

// ---- recording + images -------------------------------------------------------
// as a blob: plain static servers (python -m http.server) don't answer Range
// requests, and without them a <video> can't seek
const video = document.getElementById("rec");
video.src = URL.createObjectURL(await fetch("screen.webm").then((r) => r.blob()));
await new Promise((r) => (video.readyState >= 2 ? r() : video.addEventListener("loadeddata", r, { once: true })));
let videoFrame = -1;
async function seekRecording(f) {
  if (f === videoFrame) return;
  videoFrame = f;
  const done = new Promise((r) => video.addEventListener("seeked", r, { once: true }));
  video.currentTime = (f + 0.5) / FPS_REC;
  await done;
}
const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const appIcon = await loadImg("../../assets/brand/apple-touch-icon.png");

// ================================================================ SCREEN ====
const TAPS = REC.taps;
const CUR_START = { x: 318, y: 610 };

function cursorAt(r) {
  let prev = CUR_START;
  for (const tp of TAPS) {
    const m0 = tp.t - 0.55, m1 = tp.t - 0.08;
    if (r < m0) break;
    if (r < m1) {
      const k = E.inOutC(prog(r, m0, m1));
      // a slight arc, like a thumb moving across the glass
      return { x: lerp(prev.x, tp.x, k), y: lerp(prev.y, tp.y, k) - Math.sin(k * Math.PI) * 26 };
    }
    prev = tp;
  }
  return prev;
}

// The "finger": a liquid-glass disc (a touch indicator, not a mouse arrow).
// It magnifies the app under it, has a bright rim and a specular highlight,
// and squeezes and flares on each tap.
const GLASS_R = 50; // canvas px (25pt)
function drawCursor(r) {
  const last = TAPS[TAPS.length - 1];
  const a = prog(r, 0.4, 0.9) * (1 - prog(r, last.t + 0.9, last.t + 1.3));
  if (a <= 0) return;
  // tap ripples: a thin glass ring spreading out
  for (const tp of TAPS) {
    const k = prog(r, tp.t, tp.t + 0.6);
    if (k <= 0 || k >= 1) continue;
    sc.beginPath();
    sc.arc(tp.x * 2, tp.y * 2 + BAR, GLASS_R * (0.9 + 1.4 * E.outC(k)), 0, Math.PI * 2);
    sc.lineWidth = 7 * (1 - k) + 1;
    sc.strokeStyle = `rgba(255,255,255,${0.7 * (1 - k)})`;
    sc.shadowColor = `rgba(0,0,0,${0.25 * (1 - k)})`; sc.shadowBlur = 8;
    sc.stroke();
    sc.shadowColor = "transparent";
  }
  const p = cursorAt(r), cx = p.x * 2, cy = p.y * 2 + BAR;
  let press = 0;
  for (const tp of TAPS) press = Math.max(press, Math.sin(prog(r, tp.t - 0.1, tp.t + 0.18) * Math.PI));
  const R = GLASS_R * (1 - 0.16 * press);
  sc.save();
  sc.globalAlpha = a;
  // soft shadow under the glass
  sc.filter = "blur(9px)";
  sc.beginPath(); sc.arc(cx, cy + 7, R * 0.96, 0, Math.PI * 2); sc.fillStyle = "rgba(0,0,0,.22)"; sc.fill();
  sc.filter = "none";
  // the lens: the app under it, magnified
  sc.save();
  sc.beginPath(); sc.arc(cx, cy, R, 0, Math.PI * 2); sc.clip();
  const m = 1.3, sr = R / m;
  sc.drawImage(video, cx - sr, cy - BAR - sr, sr * 2, sr * 2, cx - R, cy - R, R * 2, R * 2);
  // glass body: clear in the middle, milky toward the edge (refraction)
  const body = sc.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
  body.addColorStop(0, `rgba(255,255,255,${0.06 + 0.18 * press})`);
  body.addColorStop(0.75, `rgba(255,255,255,${0.12 + 0.18 * press})`);
  body.addColorStop(1, "rgba(255,255,255,.55)");
  sc.fillStyle = body; sc.fillRect(cx - R, cy - R, R * 2, R * 2);
  // specular highlight, top-left
  sc.filter = "blur(4px)";
  sc.beginPath(); sc.ellipse(cx - R * 0.36, cy - R * 0.42, R * 0.36, R * 0.18, -0.6, 0, Math.PI * 2);
  sc.fillStyle = "rgba(255,255,255,.75)"; sc.fill();
  sc.filter = "none";
  sc.restore();
  // rim: bright where the light hits, darker opposite
  const rim = sc.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  rim.addColorStop(0, "rgba(255,255,255,.95)");
  rim.addColorStop(0.5, "rgba(255,255,255,.35)");
  rim.addColorStop(1, "rgba(255,255,255,.8)");
  sc.beginPath(); sc.arc(cx, cy, R - 1.5, 0, Math.PI * 2);
  sc.lineWidth = 3; sc.strokeStyle = rim; sc.stroke();
  sc.beginPath(); sc.arc(cx, cy, R + 0.5, 0, Math.PI * 2);
  sc.lineWidth = 1.5; sc.strokeStyle = "rgba(0,0,0,.18)"; sc.stroke();
  sc.restore();
}

function statusIcons(col, showTime) {
  sc.fillStyle = col; sc.strokeStyle = col;
  if (showTime) { sc.font = "600 34px Inter"; sc.textAlign = "center"; sc.textBaseline = "middle"; sc.fillText("9:41", 132, 64); }
  // signal
  for (let i = 0; i < 4; i++) { const h = 10 + i * 5; roundRect(560 + i * 11, 74 - h, 7, h, 2); sc.fill(); }
  // wi-fi
  sc.lineWidth = 5; sc.lineCap = "round";
  for (let i = 0; i < 3; i++) { sc.beginPath(); sc.arc(632, 78, 8 + i * 9, -Math.PI * 0.76, -Math.PI * 0.24); sc.stroke(); }
  // battery
  sc.lineWidth = 2.5; roundRect(668, 51, 50, 25, 8); sc.globalAlpha *= 0.45; sc.stroke(); sc.globalAlpha /= 0.45;
  roundRect(672, 55, 38, 17, 5); sc.fill();
  roundRect(721, 59, 4, 9, 2); sc.globalAlpha *= 0.45; sc.fill(); sc.globalAlpha /= 0.45;
}
function roundRect(x, y, w, h, r) { sc.beginPath(); sc.roundRect(x, y, w, h, r); }

function homeBar(col) { sc.fillStyle = col; roundRect(SW / 2 - 136, SH - 22, 272, 10, 5); sc.fill(); }

function luminanceAt(x, y) {
  const d = sc.getImageData(x, y, 1, 1).data;
  return { rgb: `rgb(${d[0]},${d[1]},${d[2]})`, l: (0.299 * d[0] + 0.587 * d[1] + 0.114 * d[2]) / 255 };
}

function drawApp(T) {
  const r = recTime(T - REC0);
  sc.drawImage(video, 0, BAR, SW, SH - BAR);
  // status bar takes the app header's colour (it dims with the modals too)
  const top = luminanceAt(SW / 2, BAR + 2);
  sc.fillStyle = top.rgb; sc.fillRect(0, 0, SW, BAR);
  statusIcons(top.l > 0.5 ? "#111" : "#fff", true);
  const bot = luminanceAt(SW / 2, SH - 40);
  homeBar(bot.l > 0.5 ? "#111" : "#fff");
  drawCursor(r);
}

function drawLock(T) {
  const g = sc.createLinearGradient(0, 0, 0, SH);
  g.addColorStop(0, "#221d17"); g.addColorStop(0.55, "#0f0d0b"); g.addColorStop(1, "#050505");
  sc.fillStyle = g; sc.fillRect(0, 0, SW, SH);
  const glowG = sc.createRadialGradient(SW / 2, SH * 0.78, 0, SW / 2, SH * 0.78, SW * 0.9);
  glowG.addColorStop(0, "rgba(242,184,75,.22)"); glowG.addColorStop(1, "rgba(242,184,75,0)");
  sc.fillStyle = glowG; sc.fillRect(0, 0, SW, SH);
  statusIcons("#fff", false);
  sc.fillStyle = "rgba(255,255,255,.82)"; sc.textAlign = "center"; sc.textBaseline = "alphabetic";
  sc.font = "600 34px Inter"; sc.fillText("Monday, September 28", SW / 2, 252);
  sc.fillStyle = "#fff"; sc.font = "700 214px Inter"; sc.fillText("9:41", SW / 2, 452);

  // the delivery notification
  const k = prog(T, T_NOTE, T_NOTE + 0.55);
  if (k > 0) {
    const y = lerp(470, 560, E.outBack(k)), a = E.outC(prog(T, T_NOTE, T_NOTE + 0.3));
    sc.save();
    sc.globalAlpha = a;
    const x0 = 30, w = SW - 60, h = 188;
    roundRect(x0, y, w, h, 46); sc.fillStyle = "rgba(92,86,78,.72)"; sc.fill();
    sc.lineWidth = 2; sc.strokeStyle = "rgba(255,255,255,.12)"; sc.stroke();
    // app icon
    sc.save(); roundRect(x0 + 28, y + 30, 86, 86, 20); sc.clip(); sc.fillStyle = "#fff"; sc.fillRect(x0 + 28, y + 30, 86, 86);
    sc.drawImage(appIcon, x0 + 30, y + 32, 82, 82); sc.restore();
    sc.textAlign = "left"; sc.fillStyle = "#fff";
    sc.font = "700 31px Inter"; sc.fillText("CHOSEN", x0 + 138, y + 62);
    sc.textAlign = "right"; sc.fillStyle = "rgba(255,255,255,.6)"; sc.font = "500 27px Inter"; sc.fillText("now", x0 + w - 32, y + 62);
    sc.textAlign = "left"; sc.fillStyle = "#fff"; sc.font = "600 29px Inter";
    sc.fillText("Delivered: Air Jordan 1 High '85", x0 + 138, y + 108);
    sc.fillStyle = "rgba(255,255,255,.85)"; sc.font = "400 28px Inter";
    sc.fillText("Your crate is at the door. Open it.", x0 + 138, y + 146);
    sc.restore();
  }
  // flashlight / camera buttons
  for (const cx of [128, SW - 128]) { sc.beginPath(); sc.arc(cx, SH - 150, 50, 0, Math.PI * 2); sc.fillStyle = "rgba(255,255,255,.14)"; sc.fill(); }
  homeBar("#fff");
  // waking up
  const wake = prog(T, T_WAKE, T_WAKE + 0.35);
  if (wake < 1) { sc.fillStyle = `rgba(0,0,0,${1 - wake})`; sc.fillRect(0, 0, SW, SH); }
}

function drawScreen(T) {
  if (T < T_SLEEP + 0.4) {
    drawApp(T);
    const off = prog(T, T_SLEEP, T_SLEEP + 0.35);
    if (off > 0) { sc.fillStyle = `rgba(0,0,0,${off})`; sc.fillRect(0, 0, SW, SH); }
  } else if (T < T_WAKE) {
    sc.fillStyle = "#000"; sc.fillRect(0, 0, SW, SH);
  } else {
    drawLock(T);
  }
  screenTex.needsUpdate = true;
}

// ================================================================ POSES =====
const PX = 1.4, PY = 2.4;
// A new angle for every chapter: the phone swings to it just after the tap
// that opens the chapter, and does a full spin after Keep.
function chapterAngle(T) {
  const keys = [
    [0, { ry: -0.2, rx: 0, rz: 0 }],
    [R0(TAP.drop) + 0.12, { ry: 0.26, rx: 0.05, rz: 0.03 }],
    [R0(TAP.crate) + 0.12, { ry: -0.06, rx: -0.05, rz: 0 }],
    [R0(TAP.keep) + 0.1, { ry: 0.3, rx: 0.02, rz: -0.035 }],
    [R0(TAP.ship) + 0.12, { ry: -0.32, rx: 0.05, rz: 0.02 }],
  ];
  const a = { ...keys[0][1] };
  for (const [t, to] of keys.slice(1)) {
    const k = E.inOutC(prog(T, t, t + 0.45));
    for (const n in a) a[n] = lerp(a[n], to[n], k);
  }
  a.ry += Math.PI * 2 * E.inOutC(prog(T, R0(TAP.keep) + 0.08, R0(TAP.keep) + 0.62));
  return a;
}
function phonePose(T) {
  const ang = chapterAngle(T);
  const up = {
    x: PX, y: PY + 0.08 * Math.sin(T * 1.1), z: 0,
    rx: ang.rx + 0.035 * Math.sin(T * 0.7), ry: ang.ry + 0.06 * Math.sin(T * 0.5), rz: ang.rz + 0.02 * Math.sin(T * 0.8),
  };
  // Entrance: it rises into frame showing its back (camera bump and all),
  // then flips forward onto its screen as it slides over to the right.
  const rise = 1 - E.outC(prog(T, 0, 0.45));
  const flip = prog(T, 0.42, 0.98);
  up.y -= rise * 3.4;
  const fe = flip < 0.8 ? E.inOutC(flip / 0.8) * 1.06 : 1.06 - 0.06 * E.outC((flip - 0.8) / 0.2); // whip over, settle back
  up.ry += Math.PI * (1 - fe);
  up.rx += 0.22 * Math.sin(E.inOutC(flip) * Math.PI);
  up.x = lerp(0.25, up.x, E.inOutC(flip));
  const k = E.inOutC(prog(T, T_PUT0, T_PUT1));
  const p = {};
  for (const n of ["x", "y", "z", "rx", "ry", "rz"]) p[n] = lerp(up[n], FLAT[n], k);
  p.y += Math.sin(k * Math.PI) * 0.7;
  // settles with a little rock
  const st = prog(T, T_PUT1, T_PUT1 + 0.5);
  if (st > 0 && st < 1) p.rx += 0.03 * Math.sin(st * Math.PI * 3) * (1 - st);
  // buzz on the notification
  const buzz = win(T, T_NOTE, T_NOTE + 0.45, 0.05, 0.05) + win(T, T_NOTE + 0.62, T_NOTE + 0.95, 0.05, 0.05);
  p.x += buzz * 0.016 * Math.sin(T * 150);
  p.ry += buzz * 0.012 * Math.sin(T * 131);
  // swiped off to the left, spinning a little as it goes
  const sw = prog(T, T_SWIPE0, T_SWIPE1);
  if (sw > 0) {
    const e = sw < 0.12 ? -0.25 * Math.sin((sw / 0.12) * Math.PI) : E.inC((sw - 0.12) / 0.88); // tiny wind-up, then gone
    p.x -= 11 * Math.max(0, e) - 0.25 * Math.min(0, e);
    p.ry += 0.9 * Math.max(0, e);
  }
  return p;
}

function boxPose(T) {
  if (T < T_DROP0) return null;
  const f = prog(T, T_DROP0, T_LAND);
  const y = BOX_BASE.y + 7.5 * (1 - f * f);
  const ry = BOX_RY - 1.1 * (1 - E.outC(f));
  const b = prog(T, T_LAND, T_LAND + 0.4);
  const squash = b > 0 && b < 1 ? Math.sin(b * Math.PI) * (1 - b * 0.5) : 0;
  return { x: BOX_BASE.x, y, z: BOX_BASE.z, ry, sy: 1 - 0.13 * squash, sx: 1 + 0.07 * squash };
}

// ∫ of a spin rate that ramps linearly from 0 (at a) to 1 (at b)
const rampInt = (T, a, b) => (T < a ? 0 : T < b ? (T - a) ** 2 / (2 * (b - a)) : (b - a) / 2 + (T - b));
function shoeY(T) {
  const y0 = BOX_BASE.y + SHOE_HH + 0.1;           // resting on the box floor
  const y1 = FLAP_TOP + SHOE_HH + SHOE_CLEAR;      // floating well above the open flaps
  return lerp(y0, y1, E.inOutC(prog(T, T_SHOE0, T_SHOE1)));
}
function shoePose(T) {
  if (T < T_SHOE0) return null;
  const hover = T > T_SHOE1 ? 0.07 * Math.sin((T - T_SHOE1) * 1.6) : 0;
  const free = E.inOutC(prog(T, T_CLEAR, T_CLEAR + 0.8));
  return {
    x: BOX_BASE.x, z: BOX_BASE.z, s: 1,
    y: shoeY(T) + hover * free,
    ry: BOX_RY + (BOX_LONG_X ? 0 : Math.PI / 2) + 0.55 * rampInt(T, T_CLEAR, T_CLEAR + 1.0),
    rx: free * 0.07 * Math.sin((T - T_CLEAR) * 0.7), rz: free * 0.09 * Math.sin((T - T_CLEAR) * 0.9),
  };
}

const V = (x, y, z) => new THREE.Vector3(x, y, z);
function camRoll(T) {
  const keys = [[0, 0], [R0(TAP.drop) + 0.1, 0.035], [R0(TAP.crate) + 0.1, -0.03], [R0(TAP.keep) + 0.1, 0.04],
    [R0(TAP.ship) + 0.1, -0.035], [T_PUT0, 0.02], [T_SWIPE0 + 0.1, -0.05], [T_OPEN, 0.015], [T_END0, 0]];
  let r = 0;
  for (const [t, v] of keys) r = lerp(r, v, E.inOutC(prog(T, t, t + 0.4)));
  return r;
}
function camAt(T) {
  // upright: the phone sits right of centre, captions on the left
  let pos = V(0, PY + 0.1, 9.4), look = V(0.25, PY, 0);
  const intro = 1 - E.outC(prog(T, 0, 1.1));
  pos.z += intro * 1.6;
  // lean in through the build, then a snap zoom on the Legendary flash
  const lean = win(T, R0(REC.marks.burst) - 0.15, R0(REC.marks.flash + 0.9), 0.5, 0.35);
  const fl = R0(REC.marks.flash);
  const snap = E.outC(prog(T, fl - 0.06, fl + 0.1)) * (1 - E.inOutC(prog(T, fl + 0.45, fl + 0.85)));
  pos.z -= 0.6 * lean + 1.5 * snap; pos.x += 0.3 * (lean + snap); look.x += 0.5 * Math.max(lean, snap);

  const TABLE = [V(0, 6.4, 5.9), V(0, 0.25, 0.25)];
  const NOTE = [V(0.15, 4.5, 3.4), V(0, 0.1, -0.2)];
  const BOXC = [V(1.1, 0.55, 7.0), V(0, 1.45, 0.2)]; // low, looking up as the box comes down
  const SHOE = [V(0, SHOE_CAM_Y, 9.7), V(-1.2, SHOE_LOOK_Y, 0.2)];
  const blend = (to, a, b) => { const k = E.inOutC(prog(T, a, b)); pos.lerp(to[0], k); look.lerp(to[1], k); };
  blend(TABLE, T_PUT0, T_PUT1 + 0.1);
  blend(NOTE, T_PUT1 + 0.1, T_NOTE + 0.9);
  blend(BOXC, T_SWIPE0 + 0.1, T_DROP0 + 0.4);
  blend(SHOE, T_OPEN - 0.1, T_SHOE1 + 0.3);
  // slow orbit around the floating shoe, drifting left to make room for type
  if (T > T_OPEN) {
    const a = (T - T_OPEN) * 0.06;
    const c = BOX_BASE;
    const dx = pos.x - c.x, dz = pos.z - c.z;
    pos.x = c.x + dx * Math.cos(a) - dz * Math.sin(a);
    pos.z = c.z + dx * Math.sin(a) + dz * Math.cos(a);
  }
  // landing jolt
  const j = prog(T, T_LAND, T_LAND + 0.35);
  if (j > 0 && j < 1) { const m = 0.05 * (1 - j); pos.y += m * Math.sin(j * 60); look.y += m * Math.sin(j * 60); }
  return [pos, look];
}

// =================================================================== FX =====
const fx = document.getElementById("fx").getContext("2d");
const fxb = document.getElementById("fxb").getContext("2d");
const _v = new THREE.Vector3();
function project(v) { _v.copy(v).project(camera); return [(_v.x + 1) / 2 * W, (1 - _v.y) / 2 * H, _v.z]; }

const DUST = (() => { const r = rng(7); return Array.from({ length: 34 }, () => ({ a: r() * Math.PI * 2, sp: 0.6 + r() * 1.3, up: 0.1 + r() * 0.35, sz: 6 + r() * 16 })); })();
const BURST = (() => { const r = rng(11); return Array.from({ length: 60 }, () => ({ a: r() * Math.PI * 2, sp: 0.4 + r() * 1.1, up: 1.4 + r() * 2.6, sz: 2 + r() * 5, gold: r() < 0.7 })); })();
const SPARK = (() => { const r = rng(23); return Array.from({ length: 80 }, () => ({ a: r() * Math.PI * 2, rad: 0.7 + r() * 1.3, h: -0.9 + r() * 2.1, sp: 0.15 + r() * 0.35, ph: r() * 10, sz: 1.5 + r() * 3.5 })); })();

function dot(ctx, x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill(); }

function drawFx(T, shoeP) {
  fx.clearRect(0, 0, W, H);
  fxb.clearRect(0, 0, W, H);
  // dust off the landing
  const d = prog(T, T_LAND, T_LAND + 1.1);
  if (d > 0 && d < 1) {
    for (const p of DUST) {
      const rr = 0.8 + p.sp * E.outC(d);
      const [x, y] = project(V(BOX_BASE.x + Math.cos(p.a) * rr, BOX_BASE.y + p.up * Math.sin(d * Math.PI), BOX_BASE.z + Math.sin(p.a) * rr * 0.9));
      dot(fx, x, y, p.sz * (0.6 + d), `rgba(140,118,92,${0.3 * (1 - d)})`);
    }
  }
  // burst out of the lid
  const b = prog(T, T_OPEN + 0.15, T_OPEN + 1.6);
  if (b > 0 && b < 1) {
    for (const p of BURST) {
      const rr = p.sp * E.outC(b) * 1.3;
      const [x, y] = project(V(BOX_BASE.x + Math.cos(p.a) * rr, BOX_BASE.y + BOX_H + p.up * E.outC(b) - 1.2 * b * b, BOX_BASE.z + Math.sin(p.a) * rr));
      dot(fx, x, y, p.sz, p.gold ? `rgba(242,176,52,${1 - b})` : `rgba(229,72,77,${1 - b})`);
    }
  }
  if (!shoeP) return;
  const c = V(shoeP.x, shoeP.y, shoeP.z);
  const [cx, cy] = project(c);
  const on = win(T, T_OPEN + 0.1, DURATION + 1, 0.9, 0.3);
  // god rays behind everything
  fxb.save();
  fxb.translate(cx, cy);
  fxb.rotate(T * 0.12);
  const R = 1100;
  for (let i = 0; i < 16; i++) {
    const a0 = (i / 16) * Math.PI * 2, w = 0.07 + 0.03 * Math.sin(i * 2.3);
    const g = fxb.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, `rgba(242,176,52,${0.42 * on})`); g.addColorStop(1, "rgba(242,176,52,0)");
    fxb.beginPath(); fxb.moveTo(0, 0); fxb.arc(0, 0, R, a0 - w, a0 + w); fxb.closePath(); fxb.fillStyle = g; fxb.fill();
  }
  fxb.restore();
  const halo = fxb.createRadialGradient(cx, cy, 0, cx, cy, 420);
  halo.addColorStop(0, `rgba(255,200,100,${0.45 * on})`); halo.addColorStop(1, "rgba(255,200,100,0)");
  fxb.fillStyle = halo; fxb.fillRect(0, 0, W, H);
  // sparkles drifting around the shoe
  for (const p of SPARK) {
    const a = p.a + (T - T_OPEN) * p.sp;
    const h = ((p.h + (T - T_OPEN) * 0.18 + 1.2) % 2.4) - 1.2;
    const [x, y, z] = project(V(c.x + Math.cos(a) * p.rad, c.y + h, c.z + Math.sin(a) * p.rad));
    const tw = 0.5 + 0.5 * Math.sin(T * 5 + p.ph);
    const ctx = Math.sin(a) < 0 ? fxb : fx; // behind or in front of the shoe
    dot(ctx, x, y, p.sz * (0.6 + tw * 0.6), `rgba(${230 + 10 * tw | 0},${150 + 50 * tw | 0},30,${on * (0.4 + 0.6 * tw) * (1 - Math.abs(h) / 1.3)})`);
  }
}

// ============================================================ CAPTIONS ======
const capsEl = document.getElementById("caps");
function caption(a, b, chip, lines, opts = {}) {
  const el = document.createElement("div");
  el.className = "cap";
  const chipHTML = chip ? `<div class="chip"><i></i>${chip}</div>` : "";
  const hl = lines.map((ln) => `<span class="ln">${ln.split(" ").map((w) => {
    const m = w.match(/^\[(\w+)\](.*)$/);
    return m ? `<span class="w"><span class="${m[1]}">${m[2]}</span></span>` : `<span class="w"><span>${w}</span></span>`;
  }).join(" ")}</span>`).join("");
  el.innerHTML = `${chipHTML}<div class="hl ${opts.sm ? "sm" : ""}">${hl}</div>${opts.sub ? `<div class="sub">${opts.sub}</div>` : ""}`;
  capsEl.appendChild(el);
  return { el, a, b, words: [...el.querySelectorAll(".w > span")], chip: el.querySelector(".chip"), sub: el.querySelector(".sub"), y: opts.y ?? 540 };
}
function R0(r) { return REC0 + outTime(r); } // rec time → spot time (hoisted: the camera uses it)
const TAP = Object.fromEntries(REC.taps.map((tp) => [tp.label, tp.t]));
const CAPS = [
  caption(R0(0.1), R0(TAP.drop - 0.2), "01 &nbsp;<b>Drops</b>", ["Pick your", "[green]drop."]),
  caption(R0(TAP.drop - 0.2), R0(TAP.crate - 0.2), "02 &nbsp;<b>Open</b>", ["Open a", "[blue]crate."]),
  caption(R0(TAP.crate - 0.2), R0(TAP.keep - 0.2), "03 &nbsp;<b>Pull</b>", ["Pull a", "[gold]grail."]),
  caption(R0(TAP.keep - 0.2), R0(TAP.ship - 0.2), "04 &nbsp;<b>Keep</b>", ["Keep", "[red]it."]),
  caption(R0(TAP.ship - 0.2), T_PUT0 + 0.6, "05 &nbsp;<b>Ship</b>", ["Ship it", "[violet]home."]),
  caption(T_NOTE + 0.2, T_SWIPE0 + 0.25, "06 &nbsp;<b>Delivered</b>", ["It's", "[green]here."]),
  caption(T_END0 + 0.3, T_TAG + 0.15, "CHOSEN.WIN", ["It's already", "[gold]chosen."], { sub: "Open it. Keep it. <b>Ship it.</b>", y: 400 }),
];
function updateCaptions(T) {
  for (const c of CAPS) {
    const on = T > c.a - 0.1 && T < c.b + 0.8;
    c.el.style.display = on ? "block" : "none";
    if (!on) continue;
    c.el.style.transform = `translateY(${c.y - c.el.offsetHeight / 2}px)`;
    c.words.forEach((w, i) => {
      const inK = E.outC(prog(T, c.a + i * 0.045, c.a + i * 0.045 + 0.38));
      const outK = E.inC(prog(T, c.b - 0.3 + i * 0.03, c.b + i * 0.03));
      w.style.transform = `translateY(${((1 - inK) - outK) * 112}%)`;
    });
    // the sticker slaps on (overshoot, a little tilt), the highlighter swipes in after the words
    const pop = E.outBack(prog(T, c.a, c.a + 0.35)), gone = E.inC(prog(T, c.b - 0.3, c.b));
    if (c.chip) {
      c.chip.style.opacity = Math.min(prog(T, c.a, c.a + 0.1), 1 - gone);
      c.chip.style.transform = `rotate(${-3 + 3 * (1 - pop)}deg) scale(${pop * (1 - 0.3 * gone)})`;
    }
    c.el.style.setProperty("--swipe", `${E.outC(prog(T, c.a + 0.35, c.a + 0.75)) * 100}%`);
    if (c.sub) c.sub.style.opacity = win(T, c.a + 0.5, c.b, 0.6, 0.35);
  }
}

// ---- colour: a glow and a big outlined word per chapter, plus film grain ---------
const CHAPTERS = [
  { a: 0, color: [158, 245, 138], word: "Drops" },
  { a: R0(TAP.drop - 0.2), color: [124, 200, 255], word: "Open" },
  { a: R0(TAP.crate - 0.2), color: [242, 184, 75], word: "Grail" },
  { a: R0(TAP.keep - 0.2), color: [255, 107, 107], word: "Keep" },
  { a: R0(TAP.ship - 0.2), color: [177, 140, 255], word: "Ship" },
  { a: T_PUT0 + 0.2, color: [158, 245, 138], word: "Delivered" },
  { a: T_SWIPE0, color: [242, 184, 75], word: "Open it" },
  { a: T_LOCK, color: [255, 107, 107], word: "'85 Chicago" },
  { a: T_END0 + 0.3, color: [242, 184, 75], word: "Chosen" },
];
const orbEl = document.getElementById("orb"), wordEl = document.getElementById("bigword");
let wordShown = "";
function updateColor(T) {
  let i = 0;
  while (i + 1 < CHAPTERS.length && T >= CHAPTERS[i + 1].a) i++;
  const cur = CHAPTERS[i], prev = CHAPTERS[Math.max(0, i - 1)];
  const k = E.inOutC(prog(T, cur.a, cur.a + 0.5));
  const [r, g, b] = cur.color.map((v, j) => Math.round(lerp(prev.color[j], v, i ? k : 1)));
  orbEl.style.background = `radial-gradient(circle, rgba(${r},${g},${b},.8) 0%, rgba(${r},${g},${b},.35) 38%, rgba(${r},${g},${b},0) 66%)`;
  // it sits behind the subject: the phone, then the box and shoe
  const pp = phonePose(T);
  const onPhone = project(V(pp.x, pp.y, pp.z));
  const onBox = project(V(BOX_BASE.x, 1.3, BOX_BASE.z));
  const m = E.inOutC(prog(T, T_SWIPE0, T_DROP0 + 0.4));
  const x = lerp(onPhone[0], onBox[0], m), y = lerp(onPhone[1], onBox[1], m);
  orbEl.style.transform = `translate(${x}px, ${y}px) scale(${1 + 0.04 * Math.sin(T * 3.3)})`;
  // the word dips out and back in on each chapter change
  const dip = Math.min(1, Math.abs(T - cur.a) / 0.25, i + 1 < CHAPTERS.length ? Math.abs(CHAPTERS[i + 1].a - T) / 0.25 : 1);
  if (wordShown !== cur.word) {
    wordShown = cur.word;
    wordEl.innerHTML = Array(5).fill(`<span>${cur.word}&nbsp;·&nbsp;</span>`).join("");
    wordEl.dataset.unit = wordEl.firstChild.offsetWidth; // one repeat, so the crawl loops seamlessly
  }
  wordEl.style.opacity = i === 0 ? Math.min(1, T / 0.4) : dip;
  wordEl.style.transform = `translate(${-((T * 120) % +wordEl.dataset.unit)}px, -50%)`;
}

// grain: a few noise tiles, a different one (and offset) every 1/12s — film
// cadence, and far kinder to the encoder than fresh noise every frame
const GRAIN = (() => {
  const r = rng(99);
  return Array.from({ length: 4 }, () => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const x = c.getContext("2d"), d = x.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = 150 + r() * 105; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0);
    return c.toDataURL();
  });
})();
const grainEl = document.getElementById("grain");
function updateGrain(T) {
  const f = Math.floor(T * 12), r = rng(f + 1);
  grainEl.style.backgroundImage = `url(${GRAIN[f % GRAIN.length]})`;
  grainEl.style.backgroundPosition = `${Math.floor(r() * 256)}px ${Math.floor(r() * 256)}px`;
}

// ---- reveal HUD + lock-on brackets --------------------------------------------------
const hudEl = document.getElementById("hud"), brEl = document.getElementById("brackets"), hudPrice = document.getElementById("hudPrice");
function updateHud(T) {
  const on = T > T_LOCK - 0.05 && T < T_END0 + 0.4;
  brEl.style.display = hudEl.style.display = on ? "block" : "none";
  if (!on) return;
  // brackets: from wide to the shoe's on-screen box, with an overshoot
  const b = new THREE.Box3().setFromObject(shoe), pts = [];
  for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) pts.push(project(V(x, y, z)));
  const x0 = Math.min(...pts.map((p) => p[0])) - 24, x1 = Math.max(...pts.map((p) => p[0])) + 24;
  const y0 = Math.min(...pts.map((p) => p[1])) - 24, y1 = Math.max(...pts.map((p) => p[1])) + 24;
  const k = E.outBack(prog(T, T_LOCK, T_LOCK + 0.3)), grow = 1.6 - 0.6 * k;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, w = (x1 - x0) * grow, h = (y1 - y0) * grow;
  const out = E.inC(prog(T, T_END0, T_END0 + 0.3));
  brEl.style.opacity = Math.min(prog(T, T_LOCK, T_LOCK + 0.1), 1 - out);
  brEl.style.transform = `translate(${cx - w / 2}px, ${cy - h / 2}px)`;
  brEl.style.width = `${w}px`; brEl.style.height = `${h}px`;
  // the tag slides in from the left, the price counts up
  const c = E.outC(prog(T, T_LOCK + 0.1, T_LOCK + 0.45));
  hudEl.style.opacity = Math.min(c, 1 - out);
  hudEl.style.transform = `translate(${150 - 60 * (1 - c)}px, ${540 - hudEl.offsetHeight / 2}px)`;
  hudEl.style.clipPath = `inset(0 ${(1 - c) * 100}% 0 0)`;
  hudPrice.textContent = `$${Math.round(895 * E.outC(prog(T, T_LOCK + 0.2, T_LOCK + 0.8)))}`;
}

// ---- closing tag ---------------------------------------------------------------------
const tagEl = document.getElementById("tag"), tagEdge = tagEl.querySelector(".edge"), tagStk = tagEl.querySelector(".stk");
const TW = [["tw1", 0.15], ["tw2", 0.5], ["tw3", 1.05]].map(([id, d]) => [document.getElementById(id), d]); // on the voice's words
function updateTag(T) {
  const k = E.inOutC(prog(T, T_TAG - 0.2, T_TAG + 0.2));
  tagEl.style.display = k > 0 ? "block" : "none";
  if (k <= 0) return;
  // a diagonal wipe from the right, led by a green edge
  const x = lerp(115, -15, k);
  tagEl.style.clipPath = `polygon(${x}% 0, 130% 0, 130% 100%, ${x - 12}% 100%)`;
  tagEdge.style.left = `calc(${x - 6}% - 30px)`;
  tagEdge.style.transform = "skewX(-6.8deg)";
  TW.forEach(([el, d], i) => {
    const p = prog(T, T_TAG + d, T_TAG + d + 0.18);
    const s = i === 2 ? lerp(1.6, 1, E.outBack(p)) : lerp(1.25, 1, E.outC(p));
    el.style.opacity = Math.min(1, p * 3);
    el.style.transform = `scale(${s}) rotate(${i === 2 ? -2 * (1 - p) - 2 : 0}deg)`;
  });
  const sp = E.outBack(prog(T, T_TAG + 1.5, T_TAG + 1.8));
  tagStk.style.opacity = Math.min(1, prog(T, T_TAG + 1.5, T_TAG + 1.6) * 1);
  tagStk.style.transform = `translateX(-50%) rotate(-3deg) scale(${sp})`;
}

// ---- light leaks ---------------------------------------------------------------------
const leakEl = document.getElementById("leak");
const LEAKS = [REC0 - 0.12, T_PUT0 + 0.05, T_DROP0 - 0.05, T_OPEN + 0.02, T_TAG - 0.05];
function updateLeak(T) {
  let a = 0, x = 0;
  for (const t of LEAKS) {
    const p = prog(T, t - 0.1, t + 0.32);
    if (p > 0 && p < 1) { a = Math.sin(p * Math.PI); x = lerp(-20, 120, E.inOutC(p)); }
  }
  leakEl.style.opacity = a;
  leakEl.style.background = `radial-gradient(ellipse 45% 90% at ${x}% 50%, rgba(255,255,255,.95) 0%, rgba(255,214,150,.75) 30%, rgba(255,120,80,.35) 55%, rgba(255,120,80,0) 75%)`;
}

// ---- bell over the phone --------------------------------------------------------
const bellEl = document.getElementById("bell");
const bellSvg = bellEl.querySelector("svg");
const rings = [...bellEl.querySelectorAll(".ring")];
function updateBell(T) {
  const a = win(T, T_NOTE, T_SWIPE0 + 0.25, 0.35, 0.3);
  bellEl.style.display = a > 0 ? "block" : "none";
  if (a <= 0) return;
  const pp = phonePose(T);
  const [x, y] = project(V(pp.x + 1.75, 0.35, -0.75)); // rides along when the phone is swiped away // just off the phone's right edge, level with the notification
  const pop = E.outBack(prog(T, T_NOTE, T_NOTE + 0.45));
  bellEl.style.opacity = a;
  bellEl.style.transform = `translate(${x}px, ${y}px) scale(${pop})`;
  const dt = (T - T_NOTE) % 1.1;
  bellSvg.style.transform = `rotate(${24 * Math.sin(dt * 22) * Math.exp(-dt * 3.2)}deg)`;
  rings.forEach((r, i) => {
    const k = ((T - T_NOTE - i * 0.55) % 1.1) / 1.1;
    r.style.opacity = T - T_NOTE - i * 0.55 > 0 ? (1 - k) * 0.8 : 0;
    r.style.transform = `scale(${1 + k * 1.1})`;
  });
}

// ================================================================ CUES =====
// Every sound in soundtrack.py hangs off this list, so audio can't drift from
// the picture. ../render.py --cues dumps it.
const CUES = [];
const cue = (t, kind, extra = {}) => CUES.push({ t: +t.toFixed(3), kind, ...extra });
cue(0.05, "intro");
cue(0.42, "flip", { dur: 0.56 });         // the phone flips from its back to its screen
cue(REC0, "settle");
cue(R0(TAP.keep) + 0.08, "spin", { dur: 0.54 }); // the 360 after Keep
for (const tp of REC.taps) cue(R0(tp.t), "tap", { label: tp.label });
cue(R0(TAP.drops + 0.12), "page");
cue(R0(TAP.drop + 0.12), "page");
cue(R0(TAP.open + 0.1), "sheet");        // "Open $125 with…"
cue(R0(TAP.cash + 0.1), "pay");
cue(R0(TAP.cash + 0.55), "crates");      // three crates slide in
cue(R0(TAP.crate + 0.1), "crateOpen");
cue(R0(REC.marks.burst), "build", { until: R0(REC.marks.flash) });
cue(R0(REC.marks.flash), "legendary");
cue(R0(REC.marks.flash + 0.7), "card");
cue(R0(TAP.keep + 0.08), "keep");
cue(R0(TAP.account + 0.12), "page");
cue(R0(TAP.ship + 0.1), "sheet");
cue(R0(REC.marks.scroll), "scroll");
cue(R0(TAP.confirm + 0.08), "confirm");
cue(R0(REC.marks.shipped + 0.35), "order"); // "Order placed" toast
for (const c of CAPS) cue(c.a, "caption");
cue(T_PUT0, "lift", { until: T_PUT1 });
cue(T_PUT1 - 0.02, "phoneDown");
cue(T_SLEEP, "lock");
cue(T_WAKE, "wake");
cue(T_NOTE, "notify");
cue(T_NOTE, "buzz", { dur: 0.45 });
cue(T_NOTE + 0.62, "buzz", { dur: 0.33 });
for (let t = T_NOTE; t < T_SWIPE0; t += 1.1) cue(t + 0.05, "bell");
cue(T_SWIPE0, "swipe", { dur: T_SWIPE1 - T_SWIPE0 });
cue(T_DROP0, "fall", { until: T_LAND });
cue(T_LAND, "land");
cue(T_CHARGE, "charge", { until: T_OPEN });
cue(T_OPEN, "open");
cue(T_SHOE0, "rise", { until: T_SHOE1 });
cue(T_SHOE1, "hover");
cue(T_END0 + 0.3, "endcard");
cue(T_TAG - 0.2, "tag");                         // the wipe
cue(T_TAG + 0.15, "voice", { file: "voice-tag.wav" }); // "Sam when, R W A?"
cue(T_TAG + 1.05, "rwa");                         // RWA? slams in
for (const t of LEAKS) cue(t, "leak");
cue(T_LOCK, "lockon");
cue(T_LOCK + 0.2, "count", { until: T_LOCK + 0.8 });
CUES.sort((x, y) => x.t - y.t);
window.CUES = {
  duration: DURATION, rec: [REC0, REC_END], burst: R0(REC.marks.burst), flash: R0(REC.marks.flash),
  put: T_PUT0, swipe: T_SWIPE0, land: T_LAND, open: T_OPEN, end: T_END0, cues: CUES,
};

// ============================================================ RENDER =====
async function renderFrame(T) {
  const r = recTime(T - REC0);
  if (T < T_SLEEP + 0.4) await seekRecording(clamp(Math.floor(r * FPS_REC), 0, NREC - 1));
  drawScreen(T);

  const p = phonePose(T);
  phone.visible = T < T_SWIPE1 + 0.05;
  phone.position.set(p.x, p.y, p.z);
  phone.rotation.set(p.rx, p.ry, p.rz);

  const bp = boxPose(T);
  box.visible = !!bp;
  if (bp) {
    box.position.set(bp.x, bp.y, bp.z);
    box.rotation.set(0, bp.ry, 0);
    box.scale.set(bp.sx, bp.sy, bp.sx);
    if (T < T_CHARGE) poseClip("Open", 0);
    else if (T < T_OPEN) poseClip("Charge", (T - T_CHARGE) * CHARGE_SPEED);
    else poseClip("Open", (T - T_OPEN) * OPEN_SPEED);
  }
  const sp = shoePose(T);
  shoe.visible = !!sp;
  if (sp) {
    shoe.position.set(sp.x, sp.y, sp.z);
    shoe.rotation.set(sp.rx, sp.ry, sp.rz);
    shoe.scale.setScalar(sp.s);
  }
  glow.intensity = T > T_OPEN ? 9 * win(T, T_OPEN, DURATION + 1, 0.4, 0.3) : 0;
  glow.position.set(BOX_BASE.x, BOX_BASE.y + BOX_H + 0.6, BOX_BASE.z + 0.4);

  const [pos, look] = camAt(T);
  camera.position.copy(pos);
  camera.lookAt(look);
  camera.rotateZ(camRoll(T)); // dutch angle, a new one per chapter
  camera.updateMatrixWorld();
  renderer.render(scene, camera);

  drawFx(T, sp);
  updateCaptions(T);
  updateBell(T);
  updateColor(T);
  updateHud(T);
  updateLeak(T);
  updateTag(T);
  updateGrain(T);
  const fadeEl = document.getElementById("fade");
  fadeEl.style.background = T > T_TAG ? "#000" : "";
  fadeEl.style.opacity = Math.max(1 - prog(T, 0, 0.5), prog(T, DURATION - 0.4, DURATION));
}
window.renderFrame = renderFrame;

// Screen-space check that the floating shoe never overlaps the box: the gap
// (px) between the shoe's lowest projected vertex and the box's highest, plus
// both rects. Used while tuning the shoe camera; not needed for renders.
window.__overlap = async (T) => {
  await renderFrame(T);
  const rect = (root) => {
    const r = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 }, v = new THREE.Vector3();
    root.updateMatrixWorld(true);
    root.traverse((n) => {
      if (!n.isMesh) return;
      const pos = n.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 20000));
      for (let i = 0; i < pos.count; i += step) {
        v.fromBufferAttribute(pos, i);
        if (n.isSkinnedMesh) n.applyBoneTransform(i, v);
        const [x, y] = project(v.applyMatrix4(n.matrixWorld));
        r.x0 = Math.min(r.x0, x); r.x1 = Math.max(r.x1, x); r.y0 = Math.min(r.y0, y); r.y1 = Math.max(r.y1, y);
      }
    });
    return Object.fromEntries(Object.entries(r).map(([k, x]) => [k, Math.round(x)]));
  };
  const s = rect(shoe), b = rect(box);
  return { T, gap: b.y0 - s.y1, shoe: s, box: b };
};

async function ready() {
  await document.fonts.load("100px Anton");
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 20px Inter`)));
  await document.fonts.ready;
  for (const t of [0.5, 20, T_PUT1, T_NOTE + 1, T_LAND, T_SHOE1, T_END0 + 1]) await renderFrame(t);
  await renderFrame(0);
}
const gli = renderer.getContext();
window.__glInfo = gli.getParameter(gli.getExtension("WEBGL_debug_renderer_info")?.UNMASKED_RENDERER_WEBGL ?? gli.RENDERER);
window.__ready = ready();

// ---- interactive scrubbing when opened directly -----------------------------------
if (!navigator.webdriver) {
  const fit = () => {
    const s = Math.min(innerWidth / W, innerHeight / H);
    document.getElementById("stage").style.transform = `scale(${s})`;
  };
  addEventListener("resize", fit); fit();
  const qs = new URLSearchParams(location.search);
  let t = parseFloat(qs.get("t") || "0"), playing = !qs.has("t"), last = null, busy = false;
  const scrub = document.getElementById("scrub");
  addEventListener("keydown", (e) => {
    if (e.key === " ") playing = !playing;
    if (e.key === "ArrowRight") t += e.shiftKey ? 1 : 1 / 30;
    if (e.key === "ArrowLeft") t -= e.shiftKey ? 1 : 1 / 30;
  });
  window.__ready.then(() => {
    const tick = async (now) => {
      if (playing && last != null) t += (now - last) / 1000;
      last = now;
      if (t >= DURATION) t = 0;
      t = clamp(t, 0, DURATION - 1e-3);
      if (!busy) { busy = true; await renderFrame(t); busy = false; }
      scrub.textContent = `${t.toFixed(2)}s / ${DURATION.toFixed(1)}  —  space: play/pause · ←/→ frame · shift: 1s`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
} else {
  document.body.classList.add("render");
}
</script>
</body>
