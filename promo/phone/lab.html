<!doctype html>
<html><head><meta charset="utf-8"><title>Model lab</title>
<!--
  Dev helper for the phone spot. ?shot renders the AJ1 '85 GLB as a square
  product photo on white (what record.py uses as the prize image);
  ?phone shows the iPhone model with a UV test grid on its screen.
-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const S = q.has("shot") ? 1000 : 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setPixelRatio(1);
renderer.setSize(q.has("shot") ? S : 1400, S);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 5); scene.add(key);
const loader = new GLTFLoader();

// The model's screen UVs point at a rotated patch of an atlas; re-project
// them flat across the screen's front face so a 0..1 texture fills it.
function planarUV(mesh) {
  const pos = mesh.geometry.attributes.position, v = new THREE.Vector3();
  const pts = [];
  for (let i = 0; i < pos.count; i++) pts.push(v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld).clone());
  const b = new THREE.Box3().setFromPoints(pts);
  const uv = new Float32Array(pos.count * 2);
  pts.forEach((p, i) => { uv[i * 2] = (p.x - b.min.x) / (b.max.x - b.min.x); uv[i * 2 + 1] = (p.y - b.min.y) / (b.max.y - b.min.y); });
  mesh.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  window.__screenBox = [b.min.toArray(), b.max.toArray()];
}

function fit(obj) {
  const b = new THREE.Box3().setFromObject(obj), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  obj.position.sub(c);
  return s;
}

if (q.has("shot")) {
  scene.background = new THREE.Color(0xffffff);
  renderer.toneMappingExposure = 1.35;
  const g = await loader.loadAsync("models/aj1-85.glb");
  const wrap = new THREE.Group(); wrap.add(g.scene); scene.add(wrap);
  // orientation is tweakable from the URL while lining up the profile
  g.scene.rotation.set(+(q.get("rx") ?? 0), +(q.get("ry") ?? 0), +(q.get("rz") ?? 0));
  const s = fit(g.scene);
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1000, 1000);
  const half = Math.max(s.x, s.y) * 0.5 / 0.86;
  Object.assign(cam, { left: -half, right: half, top: half, bottom: -half });
  cam.position.set(0, 0, 100); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix();
  window.__size = s.toArray();
  renderer.render(scene, cam);
} else {
  scene.background = new THREE.Color(0x222228);
  const g = await loader.loadAsync("models/iphone-17-pro.glb");
  scene.add(g.scene);
  const s = fit(g.scene);
  window.__size = s.toArray();
  const grid = new THREE.CanvasTexture((() => {
    const c = document.createElement("canvas"); c.width = 390; c.height = 844; const x = c.getContext("2d");
    x.fillStyle = "#f4f1ec"; x.fillRect(0, 0, 390, 844);
    x.fillStyle = "#e33"; x.fillRect(0, 0, 390, 60); x.fillStyle = "#3a3"; x.fillRect(0, 784, 390, 60);
    x.fillStyle = "#000"; x.font = "bold 40px sans-serif"; x.fillText("TOP LEFT", 10, 120); x.fillText("390x844", 100, 430);
    return c;
  })());
  grid.colorSpace = THREE.SRGBColorSpace;
  const mats = [];
  g.scene.updateMatrixWorld(true);
  g.scene.traverse((n) => { if (n.isMesh) mats.push([n.name, n.material.name]); if (n.isMesh && n.material.name === "Screen_BG") { planarUV(n); n.material.map = grid; n.material.emissiveMap = grid; n.material.emissive.set(0xffffff); n.material.needsUpdate = true; window.__screenUV = (() => { const uv = n.geometry.attributes.uv; let a = [9, 9, -9, -9]; for (let i = 0; i < uv.count; i++) { a[0] = Math.min(a[0], uv.getX(i)); a[1] = Math.min(a[1], uv.getY(i)); a[2] = Math.max(a[2], uv.getX(i)); a[3] = Math.max(a[3], uv.getY(i)); } return a; })(); } });
  window.__mats = mats;
  const cam = new THREE.PerspectiveCamera(30, 1400 / S, 0.01, 1000);
  const d = Math.max(...s.toArray()) * 2.2;
  cam.position.set(+(q.get("cx") ?? 0), +(q.get("cy") ?? 0), +(q.get("cz") ?? d)); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
}
window.__done = true;
</script>
</body></html>
