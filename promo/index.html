  3D boxes, the particle canvas and the DOM overlays for second t, so the
  video comes out identical at any frame rate. Open this page in a browser
  to scrub it (arrow keys / space) — ?t=7.2 jumps to a moment.

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const W = 1920, H = 1080;
const DURATION = 30;
window.DURATION = DURATION;
const A = "../assets/";

// ---------------------------------------------------------------- math ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inQ: (x) => x * x,
  outQ: (x) => 1 - (1 - x) * (1 - x),
  outC: (x) => 1 - Math.pow(1 - x, 3),
  inC: (x) => x * x * x,
  inOutC: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outExpo: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  inExpo: (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10)),
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  outElastic: (x) => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
};
// window: 0 before a, eased 0→1 over [a, a+i], hold, 1→0 over [b-o, b]
function win(t, a, b, i = 0.25, o = 0.25, ein = E.outC, eout = E.inC) {
  if (t < a || t > b) return 0;
  const up = i > 0 ? ein(prog(t, a, a + i)) : 1;
  const dn = o > 0 ? 1 - eout(prog(t, b - o, b)) : 1;
  return Math.min(up, dn);
}
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(t, seed = 0) { // smooth value noise, -1..1
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57.3), hash(i + 1 + seed * 57.3), u) * 2 - 1;
}
const money = (v, dp = 0) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });

// -------------------------------------------------------------- prizes ----
const RC = { common: "#B9B9BE", uncommon: "#4ADE80", rare: "#4FA3F7", epic: "#B678F2", legendary: "#F2B84B" };
const RARITY_CYCLE = [RC.common, RC.uncommon, RC.rare, RC.epic, RC.legendary];

const MULTI = [

  P("Air Jordan 4 White Thunder", 404, "epic", "air-jordan-4-white-thunder.png"),
  P("Nike Blazer SB Mid Supreme Black", 3669, "legendary", "nike-blazer-sb-mid-supreme-black.png"),
  P("Air Jordan 1 Low Travis Scott Canary", 308, "rare", "air-jordan-1-low-travis-scott-canary.png"),
  P("BAPE Tiger Full Zip Hoodie Grey", 477, "legendary", "bape-tiger-full-zip-hoodie-grey.png"),
];
const WALL = [
  "nike-air-force-1-low-laser-by-mark-smith.png", "bearbrick-scarlet-spider-100-400-set.png", "supreme-astronaut-hoodie-burgundy.png",
  "air-jordan-4-bred-reimagined.png", "kaws-bff-plush-black.png", "supreme-20th-anniversary-skateboard.png", "nike-kobe-6-protro-all-star.png",
  "bape-abc-camo-tiger-full-zip-hoodie-green.png", "air-jordan-5-awake-arctic-pink.png", "supreme-ebony-zippo.png",
  "bearbrick-optimus-prime-100-400-set.png", "denim-tears-big-cotton-wreath-hoodie-purple.png", "air-jordan-1-high-satin-royal.png",
  "supreme-inflatable-blimp.png", "nike-sb-dunk-low-yuto-horigome.png", "kith-marvel-galactus-vintage-tee-black.png",
  "air-jordan-4-fear.png", "bearbrick-sesame-street-elmo-400.png", "supreme-gucci-mane-tee-grey.png", "nike-air-max-95-toronto.png",
  "pop-mart-labubu-the-monster-let-s-checkmate.png", "air-jordan-3-j-balvin-rio.png", "supreme-spin-skateboard-green.png",
  "new-balance-990v3-miusa-kith-steel-blue.png", "bearbrick-mickey-mouse-bape-100-and-400-set-pink.png", "nike-air-foamposite-pro-wolf-grey.png",
  "air-jordan-8-ovo-calipari-pack-kentucky-white.png", "supreme-wilson-american-mini-football-brown.png", "essentials-fw23-hoodie-cloud-dance.png",
  "air-jordan-4-nigel-sylvester-brick-by-brick.png",
].map((f) => A + "prizes/" + f);

// ------------------------------------------------------------ DOM kit -----
const ui = document.getElementById("ui");
function el(html, parent = ui) {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  const n = d.firstElementChild;
  parent.appendChild(n);
  return n;
}
const uiBack = document.getElementById("uiBack");
function scene(id) {
  const r = el(`<div class="scene" id="${id}"></div>`);
  r.back = el(`<div class="scene"></div>`, uiBack);
  return r;
}
// kinetic headline: words wrapped for a masked slide-up. *word* = gold, _word_ = green
function words(text) {
  let mode = "";
  return text.split(" ").map((w) => {
    if (w.startsWith("*")) mode = "acc-gold";
    if (w.startsWith("_")) mode = "acc-green";
    const cls = mode;
    if (/[*_][.!?,]?$/.test(w)) mode = "";
    return `<span class="w"><span class="${cls}">${w.replace(/[*_]/g, "")}</span></span>`;
  }).join(" ");
}
function kinetic(node, t, t0, { stagger = 0.06, dur = 0.42, out = 1e9, outDur = 0.3 } = {}) {
  const spans = node.__spans || (node.__spans = [...node.querySelectorAll(".w > span")]);
  spans.forEach((s, i) => {
    const pin = E.outExpo(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    const pout = E.inC(prog(t, out + i * 0.03, out + i * 0.03 + outDur));
    s.style.transform = `translateY(${(1 - pin) * 105 - pout * 105}%)`;
  });
}
function place(n, x, y, { s = 1, r = 0, o = 1, sx = 1, sy = 1, extra = "" } = {}) {
  n.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${r}deg) scale(${s * sx}, ${s * sy}) ${extra}`;
  n.style.opacity = o;
}
function cardHTML(p, cls = "") {
  return `<div class="abs card ${cls}" style="--rc:${RC[p.rarity]}">
    <div class="ph"><img src="${p.img}"></div>
    <div class="meta"><div class="rar">${p.rarity}</div><div class="nm">${p.name}</div><div class="pr">${money(p.price)}</div></div>
  </div>`;
}
const ICON = {
  cash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v5M18 9.5v5"/></svg>`,
  keep: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>`,
  list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="8" cy="8" r="1.6"/></svg>`,
  ship: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4h14v12H1zM15 9h4l4 4v3h-8z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  cursor: `<svg viewBox="0 0 24 24" width="54" height="54"><path d="M5 2.5v17.2l4.6-4.3 3 6.6 3.1-1.4-3-6.5 6.3-.3z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
};

// ------------------------------------------------------------ three.js ----
const glCanvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const gl3 = new THREE.Scene();
{
  const pm = new THREE.PMREMGenerator(renderer);
  gl3.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  pm.dispose();
}
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
const ambient = new THREE.AmbientLight(0xffffff, 0.9);
const key = new THREE.DirectionalLight(0xfff4e6, 2.8);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 0.5, far: 30 });
key.shadow.radius = 6;
const rim = new THREE.DirectionalLight(0xffffff, 2.2);
rim.position.set(-3, 3, -4);
const glow = new THREE.PointLight(0xf2b84b, 0, 6, 1.6); // light spilling out of an opening box
gl3.add(ambient, key, rim, glow);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.5 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
gl3.add(ground);

const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(A + "models/box-chosen-od.glb");
const clipsByName = Object.fromEntries(gltf.animations.map((c) => [c.name, c]));
const baseModel = gltf.scene;
baseModel.updateMatrixWorld(true);
const bodyBox = new THREE.Box3().setFromObject(baseModel.getObjectByName("CrateBody") ?? baseModel);
const bodySize = bodyBox.getSize(new THREE.Vector3());
const bodyCenter = bodyBox.getCenter(new THREE.Vector3());
const BOX_SCALE = 1.6 / Math.max(bodySize.x, bodySize.z); // ~1.6 world units across
const BOX_H = bodySize.y * BOX_SCALE;

class Box {
  constructor() {
    this.group = new THREE.Group();
    this.model = SkeletonUtils.clone(baseModel);
    this.model.scale.setScalar(BOX_SCALE);
    this.model.position.set(-bodyCenter.x * BOX_SCALE, -bodyBox.min.y * BOX_SCALE, -bodyCenter.z * BOX_SCALE); // sits on y=0
    this.model.traverse((n) => {
      if (n.isMesh) { n.castShadow = true; n.frustumCulled = false; n.material = n.material.clone(); n.material.envMapIntensity = 0.9; }
    });
    this.group.add(this.model);
    gl3.add(this.group);
    this.mixer = new THREE.AnimationMixer(this.model);
    this.actions = {};
    for (const n of ["Charge", "Open"]) {
      const a = this.mixer.clipAction(clipsByName[n]);
      a.setLoop(THREE.LoopOnce, 1);
      a.clampWhenFinished = true;
      this.actions[n] = a;
    }
  }
  pose(s) {
    this.group.visible = !!s && s.s > 0.001;
    if (!this.group.visible) return;
    this.group.position.set(s.x || 0, s.y || 0, s.z || 0);
    this.group.rotation.set(s.rx || 0, s.ry || 0, s.rz || 0);
    this.group.scale.set(s.s * (s.sx || 1), s.s * (s.sy || 1), s.s * (s.sx || 1));
    // pose from a baked clip at an explicit time (no mixer clock)
    const clip = s.clip || "Open";
    for (const [n, a] of Object.entries(this.actions)) {
      if (n === clip) { a.enabled = true; a.setEffectiveWeight(1); a.play(); a.time = clamp(s.ct || 0, 0, a.getClip().duration - 1e-4); }
      else { a.enabled = false; a.stop(); }
    }
    this.mixer.update(0);
  }
}
const boxes = Array.from({ length: 5 }, () => new Box());
const OPEN_DUR = clipsByName.Open.duration; // 1.75
const CHARGE_DUR = clipsByName.Charge.duration; // 1.71

const _v = new THREE.Vector3();
function project(x, y, z) {
  _v.set(x, y, z).project(camera);
  return [(_v.x + 1) / 2 * W, (1 - _v.y) / 2 * H];
}

// ------------------------------------------------------------- fx canvas --
const fxFront = document.getElementById("fx").getContext("2d");
const fxb = document.getElementById("fxb").getContext("2d");
let fx = fxFront;
// glows and rays sit behind the 3D boxes; sparks, rings and confetti in front
const behind = (fn) => (...a) => { const prev = fx; fx = fxb; try { fn(...a); } finally { fx = prev; } };
const rays = behind(function rays(cx, cy, color, alpha, rot, n = 14, len = 1400, width = 0.09) {
  if (alpha <= 0.002) return;
  fx.save();
  fx.translate(cx, cy);
  fx.rotate(rot);
  fx.globalCompositeOperation = "lighter";
  const g = fx.createRadialGradient(0, 0, 0, 0, 0, len);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  fx.fillStyle = g;
  fx.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const w = width * (0.6 + hash(i * 3.1) * 0.8);
    fx.beginPath();
    fx.moveTo(0, 0);
    fx.arc(0, 0, len, a - w, a + w);
    fx.closePath();
    fx.fill();
  }
  fx.restore();
});
const glowDisc = behind(function glowDisc(cx, cy, r, color, alpha) {
  if (alpha <= 0.002) return;
  fx.save();
  fx.globalCompositeOperation = "lighter";
  fx.globalAlpha = alpha;
  const g = fx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  fx.fillStyle = g;
  fx.fillRect(cx - r, cy - r, r * 2, r * 2);
  fx.restore();
});
// Deterministic particle burst: particle i's whole life is a formula of (t - t0).
function burst(t, t0, { x, y, n = 120, colors = ["#fff"], speed = [300, 1400], life = [0.6, 1.6], size = [3, 9], grav = 900, spread = Math.PI * 2, dir = -Math.PI / 2, seed = 1, drag = 1.6, shape = "spark" }) {
  const age = t - t0;
  if (age < 0) return;
  fx.save();
  fx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 1.37 + seed * 91.1), h2 = hash(i * 2.71 + seed * 13.7), h3 = hash(i * 0.91 + seed * 7.3), h4 = hash(i * 5.3 + seed);
    const L = lerp(life[0], life[1], h3);
    if (age > L) continue;
    const a = dir + (h1 - 0.5) * spread;
    const v = lerp(speed[0], speed[1], Math.pow(h2, 0.7));
    const k = (1 - Math.exp(-drag * age)) / drag; // velocity with drag, integrated
    const px = x + Math.cos(a) * v * k;
    const py = y + Math.sin(a) * v * k + 0.5 * grav * age * age;
    const fade = 1 - age / L;
    const sz = lerp(size[0], size[1], h4) * (0.4 + 0.6 * fade);
    fx.globalAlpha = fade;
    fx.fillStyle = colors[i % colors.length];
    if (shape === "spark") {
      const vx = Math.cos(a) * v * Math.exp(-drag * age), vy = Math.sin(a) * v * Math.exp(-drag * age) + grav * age;
      const m = Math.hypot(vx, vy) || 1;
      const tl = Math.min(60, m * 0.03) + sz;
      fx.strokeStyle = colors[i % colors.length];
      fx.lineWidth = sz * 0.55;
      fx.lineCap = "round";
      fx.beginPath();
      fx.moveTo(px, py);
      fx.lineTo(px - (vx / m) * tl, py - (vy / m) * tl);
      fx.stroke();
    } else if (shape === "confetti") {
      fx.save();
      fx.translate(px, py);
      fx.rotate(age * (4 + h1 * 8) + h2 * 6);
      fx.globalCompositeOperation = "source-over";
      fx.fillRect(-sz, -sz * 0.45 * Math.abs(Math.cos(age * 9 + h3 * 6)), sz * 2, sz * 0.9 * Math.abs(Math.cos(age * 9 + h3 * 6)) + 1);
      fx.restore();
    } else {
      fx.beginPath();
      fx.arc(px, py, sz, 0, Math.PI * 2);
      fx.fill();
    }
  }
  fx.restore();
}
function ring(t, t0, x, y, color, maxR = 700, dur = 0.7, width = 10, sy = 1) {
  const p = prog(t, t0, t0 + dur);
  if (p <= 0 || p >= 1) return;
  fx.save();
  fx.globalCompositeOperation = "lighter";
  fx.strokeStyle = color;
  fx.globalAlpha = 1 - p;
  fx.lineWidth = width * (1 - p) + 1;
  fx.beginPath();
  fx.ellipse(x, y, maxR * E.outExpo(p), maxR * E.outExpo(p) * sy, 0, 0, Math.PI * 2);
  fx.stroke();
  fx.restore();
}
function embers(t, alpha, color = "#F2B84B", n = 60, seed = 3) {
  if (alpha <= 0) return;
  fx.save();
  fx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const sp = 40 + hash(i + seed) * 90;
    const x = (hash(i * 7.7 + seed) * W + noise1(t * 0.5 + i, i) * 40) % W;
    const y = H + 40 - ((hash(i * 3.3 + seed) * (H + 80) + t * sp) % (H + 80));
    const r = 1 + hash(i * 9.1) * 2.6;
    fx.globalAlpha = alpha * (0.3 + 0.7 * hash(i * 1.9)) * (0.6 + 0.4 * Math.sin(t * 3 + i));
    fx.fillStyle = color;
    fx.beginPath();
    fx.arc(x, y, r, 0, Math.PI * 2);
    fx.fill();
  }
  fx.restore();
}
function speedLines(t, alpha, seed = 1) {
  if (alpha <= 0) return;
  fx.save();
  fx.globalAlpha = alpha;
  fx.strokeStyle = "#fff";
  for (let i = 0; i < 40; i++) {
    const y = hash(i * 4.1 + seed) * H;
    const len = 300 + hash(i * 2.2 + seed) * 900;
    const x = ((hash(i * 8.8 + seed) * 2 - 0.5) * W - t * 9000 * (0.6 + hash(i) * 0.8)) % (W * 2) + W;
    fx.lineWidth = 1 + hash(i * 6.6) * 3;
    fx.beginPath();
    fx.moveTo(x, y);
    fx.lineTo(x + len, y);
    fx.stroke();
  }
  fx.restore();
}

// ============================================================ 3D TIMELINE ==
const LOOP_OPEN = (i) => 23.55 + [0.12, 0.3, 0, 0.42, 0.22][i]; // centre box first, then outward
const boxState = {
  open(t) {
    // drop from above, land at 1.0 with a squash
    const fall = prog(t, 0.55, 1.0);
    const y = t < 1.0 ? lerp(4.2, 0, E.inQ(fall)) : 0;
    const land = prog(t, 1.0, 1.45);
    const squash = t >= 1.0 ? 1 - 0.22 * Math.exp(-land * 6) * Math.cos(land * 14) : 1 + fall * 0.08;
    return [{ s: t < 0.55 ? 0 : 1, y, sy: squash, sx: 1 / Math.sqrt(squash), ry: -0.55 + t * 0.18, rx: t < 1 ? (1 - fall) * 0.35 : 0, ct: 0 }];
  },
  pick(t) {
    const out = E.inOutC(prog(t, 4.2, 4.75));
    const lift = E.outBack(prog(t, 3.7, 3.95));
    return [-1, 0, 1].map((k, i) => {
      if (k === 0) {
        return { s: 1, x: 0, y: 0.18 * lift, ry: lerp(-0.2 + (t - 2.4) * 0.5, -0.35, E.inOutC(prog(t, 3.7, 4.6))), ct: 0 };
      }
      const inP = E.outBack(prog(t, 2.45 + (k > 0 ? 0.08 : 0), 2.95 + (k > 0 ? 0.08 : 0)));
      return { s: 1, x: k * lerp(7, 2.4, inP) + k * out * 6, ry: k * 0.5 + (t - 2.4) * 0.5 * k, ct: 0, sy: 1 };
    });
  },
  reveal(t) {
    // charge 4.9→6.6 (baked shake + our own rising tremor), open 6.6→8.35
    const ch = prog(t, 4.95, 6.65);
    const tremor = E.inQ(ch) * (t < 6.65 ? 1 : 0);
    const jx = noise1(t * 38, 1) * 0.05 * tremor, jz = noise1(t * 41, 2) * 0.04 * tremor;
    const hop = t > 6.6 ? Math.sin(prog(t, 6.6, 6.95) * Math.PI) * 0.25 : 0;
    const sink = E.inC(prog(t, 7.7, 8.4));
    const base = { s: 1, x: jx, z: jz, y: hop - sink * 2.6, ry: -0.35 + noise1(t * 30, 3) * 0.05 * tremor, rz: noise1(t * 33, 4) * 0.04 * tremor };
    if (t < 6.6) return [{ ...base, clip: "Charge", ct: clamp(t - 4.95, 0, CHARGE_DUR) }];
    return [{ ...base, clip: "Open", ct: (t - 6.6) * 1.15 }];
  },
  ship(t) {
    // open box waits for the card, flaps close (Open clip in reverse), then it slides off right
    const close = prog(t, 20.6, 21.25);
    const go = E.inC(prog(t, 21.85, 22.35));
    const land = E.outBack(prog(t, 19.8, 20.15));
    return { s: land, x: 1.55 + go * 6, y: 0, ry: -0.5 + go * -0.4, rz: go * -0.08, clip: "Open", ct: OPEN_DUR * (1 - E.inOutC(close)) };
  },
  loop(t) {
    return MULTI.map((_, i) => {
      const k = i - 2;
      const pop = E.outBack(prog(t, 22.9 + Math.abs(k) * 0.07, 23.25 + Math.abs(k) * 0.07), 2);
      const o0 = LOOP_OPEN(i);
      return { s: pop * 0.92, x: k * 2.25, ry: -0.3 + k * 0.08 + Math.sin(t * 2 + i) * 0.05, clip: "Open", ct: t > o0 ? (t - o0) * 2.2 : 0,
        y: t > o0 ? Math.sin(prog(t, o0, o0 + 0.3) * Math.PI) * 0.18 : 0 };
    });
  },
  end(t) {
    const pop = E.outBack(prog(t, 25.0, 25.25), 2);
    const drop = E.inC(prog(t, 25.7, 26.3));
    return [{ s: pop * (1 - drop * 0.3), y: -drop * 3.2, ry: -0.35 + (t - 25) * 0.4, clip: "Open", ct: clamp((t - 25.1) * 3.2, 0, OPEN_DUR) }];
  },
};
function camAt(t) {
  // [pos, look]
  if (t < 2.4) return [[0, 1.1, lerp(5.6, 4.7, E.outC(prog(t, 0, 2.4)))], [0, 0.5, 0]];
  if (t < 4.8) {
    const p = E.inOutC(prog(t, 4.15, 4.8));
    return [[0, lerp(1.5, 1.2, p), lerp(8.4 - (t - 2.4) * 0.15, 5.6, p)], [0, lerp(-0.1, 0.3, p), 0]];
  }
  if (t < 9) {
    const push = E.inQ(prog(t, 4.8, 6.6));
    const up = E.inOutC(prog(t, 6.9, 7.8));
    return [[0, lerp(1.2, 1.5, up), lerp(5.6, 4.7, push) + up * 0.6], [0, lerp(0.3, 0.95, up), 0]];
  }
  if (t >= 19.8 && t < 22.4) return [[0, 1.3, 7.2], [0.2, 0.35, 0]];
  if (t >= 22.4 && t < 25) return [[0, 2.1, lerp(13.4, 12.8, prog(t, 22.4, 25))], [0, 0.95, 0]];
  if (t >= 25) return [[0, 1.2, 6.2], [0, 0.35, 0]];
  return [[0, 1.2, 6], [0, 0.3, 0]];
}
function boxesAt(t) {
  if (t < 2.4) return boxState.open(t);
  if (t < 4.8) return boxState.pick(t);
  if (t < 9) return boxState.reveal(t);
  if (t >= 19.8 && t < 22.4) return [boxState.ship(t)];
  if (t >= 22.4 && t < 25) return boxState.loop(t);
  if (t >= 25) return boxState.end(t);
  return [];
}

// ============================================================ FX TIMELINE ==
function drawFx(t) {
  fxFront.clearRect(0, 0, W, H);
  fxb.clearRect(0, 0, W, H);
  // S1: landing dust + shock
  if (t < 2.4) {
    const [gx, gy] = project(0, 0.05, 0);
    ring(t, 1.0, gx, gy, "rgba(255,255,255,.7)", 900, 0.7, 14, 0.18);
    burst(t, 1.0, { x: gx, y: gy, n: 90, colors: ["#c9a27a", "#8a6a4a", "#ffffff"], speed: [300, 1300], life: [0.4, 1.1], size: [2, 6], grav: 300, spread: Math.PI * 0.9, dir: -Math.PI / 2, seed: 11, shape: "dot", drag: 3 });
    embers(t, 0.35, "#ffffff", 40, 5);
  }
  // S2: selection glow under the middle crate
  if (t >= 2.4 && t < 4.8) {
    const [gx, gy] = project(0, 0.02, 0);
    const a = win(t, 3.7, 4.8, 0.15, 0.3);
    fx = fxb;
    fx.save();
    fx.globalCompositeOperation = "lighter";
    fx.globalAlpha = a * 0.8;
    const g = fx.createRadialGradient(gx, gy, 0, gx, gy, 380);
    g.addColorStop(0, "rgba(242,184,75,.8)");
    g.addColorStop(1, "rgba(242,184,75,0)");
    fx.fillStyle = g;
    fx.beginPath();
    fx.ellipse(gx, gy, 380, 80, 0, 0, Math.PI * 2);
    fx.fill();
    fx.restore();
    fx = fxFront;
    ring(t, 3.7, gx, gy, "#F2B84B", 420, 0.6, 8, 0.2);
  }
  // S3: charge → burst
  if (t >= 4.8 && t < 9.05) {
    const [cx, cy] = project(0, BOX_H * 0.7, 0);
    const ch = prog(t, 4.95, 6.65);
    // rarity roulette: the glow cycles common→legendary, faster and faster
    const cyc = Math.floor(Math.pow(ch, 1.6) * 22);
    const col = t < 6.6 ? RARITY_CYCLE[cyc % 5] : RC.legendary;
    rays(cx, cy, col, E.inQ(ch) * 0.35 * (t < 6.7 ? 1 : 0), t * 0.8, 16, 1100);
    glowDisc(cx, cy, 300 + ch * 250, col, E.inQ(ch) * 0.5 * (t < 6.7 ? 1 : 0));
    burst(t, 5.4, { x: cx, y: cy, n: 40, colors: [col], speed: [60, 260], life: [0.4, 1.2], size: [2, 4], grav: -120, seed: 21, shape: "dot" });
    // the open
    const o = win(t, 6.7, 9.0, 0.08, 0.6);
    rays(cx, cy - 40, "rgba(242,184,75,1)", o * 0.55, t * 0.35, 18, 1500, 0.07);
    glowDisc(cx, cy, 900, "rgba(242,184,75,1)", o * 0.45);
    ring(t, 6.72, cx, cy, "#fff", 1100, 0.8, 22);
    ring(t, 6.8, cx, cy, "#F2B84B", 900, 0.9, 12);
    burst(t, 6.72, { x: cx, y: cy, n: 220, colors: ["#F2B84B", "#fff3cf", "#ffffff", "#ffcf6b"], speed: [500, 2200], life: [0.7, 1.8], size: [3, 10], grav: 1100, seed: 7 });
    burst(t, 6.75, { x: cx, y: cy, n: 90, colors: ["#F2B84B", "#fff"], speed: [200, 900], life: [1.0, 2.2], size: [2, 5], grav: 200, seed: 8, shape: "dot", drag: 2 });
    embers(t, win(t, 6.8, 9.0, 0.3, 0.3) * 0.8, "#F2B84B", 70, 9);
  }
  // S4: speed lines on the montage
  if (t >= 9 && t < 11) speedLines(t, 0.08, 4);
  // S5→S6 transitions: whoosh lines
  if (t >= 12.3 && t < 12.55) speedLines(t, 0.25 * win(t, 12.3, 12.55, 0.05, 0.1), 6);
  // S6: card → cash stream into the wallet
  if (t >= 12.4 && t < 15) {
    const wx = 960, wy = 250;
    fx.save();
    fx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 90; i++) {
      const t0 = 12.95 + hash(i * 3.3) * 0.45;
      const p = prog(t, t0, t0 + 0.55);
      if (p <= 0 || p >= 1) continue;
      const e = E.inOutC(p);
      const sx = 960 + (hash(i * 1.1) - 0.5) * 260, sy = 530 + (hash(i * 2.2) - 0.5) * 300;
      const mx = lerp(sx, wx, 0.5) + (hash(i * 5.5) - 0.5) * 700, my = lerp(sy, wy, 0.5) + 80;
      const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * mx + e * e * wx;
      const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * my + e * e * wy;
      fx.globalAlpha = Math.sin(p * Math.PI);
      fx.fillStyle = i % 3 ? "#4ADE80" : "#d9ffe6";
      fx.beginPath();
      fx.arc(x, y, 3 + hash(i * 7.1) * 6, 0, Math.PI * 2);
      fx.fill();
    }
    fx.restore();
    glowDisc(960, 250, 500, "rgba(74,222,128,1)", win(t, 13.3, 14.4, 0.1, 0.8) * 0.35);
    burst(t, 13.35, { x: 960, y: 250, n: 70, colors: ["#4ADE80", "#fff"], speed: [300, 1100], life: [0.5, 1.2], size: [2, 6], grav: 900, seed: 31 });
    glowDisc(960, 540, 700, "rgba(74,222,128,1)", 0.12 * win(t, 12.4, 15, 0.3, 0.3));
  }
  // S7: slot sparkle
  if (t >= 15 && t < 17.4) {
    const sx = 1340 + (-500 + 105) * 0.92 + 40, sy = 540 + (-325 + 330 + 147) * 0.92;
    glowDisc(sx, sy, 380, "rgba(242,184,75,1)", win(t, 16.08, 17.2, 0.05, 0.9) * 0.6);
    ring(t, 16.1, sx, sy, "#F2B84B", 320, 0.6, 10);
    burst(t, 16.1, { x: sx, y: sy, n: 60, colors: ["#F2B84B", "#fff"], speed: [200, 900], life: [0.4, 1.0], size: [2, 6], grav: 600, seed: 41 });
    glowDisc(1340, 540, 900, "rgba(242,184,75,1)", 0.1 * win(t, 15, 17.4, 0.3, 0.3));
  }
  // S8: sold — confetti
  if (t >= 17.4 && t < 19.8) {
    glowDisc(960, 560, 900, "rgba(79,163,247,1)", 0.1 * win(t, 17.4, 19.8, 0.3, 0.3));
    ring(t, 19.0, 720, 560, "#F2B84B", 600, 0.6, 14);
    burst(t, 19.0, { x: 720, y: 560, n: 160, colors: ["#F2B84B", "#4ADE80", "#4FA3F7", "#B678F2", "#fff"], speed: [500, 1700], life: [1.2, 2.0], size: [6, 12], grav: 1300, seed: 51, shape: "confetti", drag: 2.2 });
  }
  // S9: box glow while open
  if (t >= 19.8 && t < 22.4) {
    const b = boxState.ship(t);
    const [cx, cy] = project(b.x, BOX_H, 0);
    glowDisc(cx, cy, 420, "rgba(182,120,242,1)", win(t, 19.9, 21.2, 0.2, 0.3) * 0.45);
    glowDisc(960, 540, 900, "rgba(182,120,242,1)", 0.08 * win(t, 19.8, 22.4, 0.3, 0.3));
    ring(t, 21.22, cx, cy + 40, "rgba(255,255,255,.8)", 500, 0.5, 10, 0.3);
    speedLines(t, 0.18 * win(t, 21.9, 22.4, 0.1, 0.1), 9);
  }
  // S10: five boxes, five bursts, five rarities
  if (t >= 22.4 && t < 25) {
    boxState.loop(t).forEach((b, i) => {
      const o0 = LOOP_OPEN(i);
      const col = RC[MULTI[i].rarity];
      const [cx, cy] = project(b.x, BOX_H * 0.7, 0);
      glowDisc(cx, cy, 260, col, win(t, o0, 25, 0.05, 0.4) * 0.55);
      rays(cx, cy, col, win(t, o0, 25, 0.05, 0.5) * 0.28, t * 0.5 + i, 12, 420);
      burst(t, o0 + 0.05, { x: cx, y: cy, n: 60, colors: [col, "#fff"], speed: [300, 1100], life: [0.5, 1.2], size: [2, 6], grav: 1100, seed: 60 + i });
    });
  }
  // S11: logo burst, then slow rays + embers under the end card
  if (t >= 25) {
    const [bx, by] = project(0, BOX_H * 0.7, 0);
    ring(t, 25.45, bx, by, "#fff", 1300, 0.8, 20);
    burst(t, 25.45, { x: bx, y: by, n: 240, colors: ["#F2B84B", "#fff3cf", "#ffffff"], speed: [600, 2400], life: [0.8, 1.9], size: [3, 10], grav: 1000, seed: 71 });
    const a = win(t, 25.45, 40, 0.3, 0);
    rays(960, 420, "rgba(242,184,75,1)", a * 0.16, t * 0.12, 20, 1500, 0.05);
    glowDisc(960, 420, 900, "rgba(242,184,75,1)", a * 0.16);
    embers(t, a * 0.8, "#F2B84B", 80, 13);
  }
}

// ============================================================== GLOBALS ==
const bg = document.getElementById("bg");
const flash = document.getElementById("flash");
const shakeEl = document.getElementById("shake");
const grain = document.getElementById("grain");
function globals(t) {
  // spotlight tint per scene
  const spots = [
    [0, "#1c1c22"], [4.8, "#1c1c22"], [6.7, "#3a2a0c"], [9, "#16161b"], [12.4, "#0e2416"], [15, "#2a200c"],
    [17.4, "#0d1a2c"], [19.8, "#1e1030"], [22.4, "#1c1c22"], [25, "#2a1f0a"],
  ];
  let spot = spots[0][1];
  for (const [at, c] of spots) if (t >= at) spot = c;
  bg.style.setProperty("--spot", spot);
  // white flashes on the big hits
  const hits = [[1.0, 0.35], [6.72, 0.9], [9.0, 0.25], [11.0, 0.2], [12.4, 0.2], [15.0, 0.2], [17.4, 0.2], [19.0, 0.35], [19.8, 0.2], [22.4, 0.2], [25.45, 0.85]];
  let f = 0;
  for (const [at, amt] of hits) f = Math.max(f, amt * (1 - prog(t, at, at + 0.22)) * (t >= at ? 1 : 0));
  flash.style.opacity = f;
  // camera shake
  const shakes = [[1.0, 18, 0.5], [6.72, 26, 0.7], [19.0, 12, 0.4], [25.45, 20, 0.6]];
  let amp = 0;
  for (const [at, a, d] of shakes) if (t >= at) amp = Math.max(amp, a * Math.exp(-prog(t, at, at + d) * 5) * (t < at + d ? 1 : 0));
  amp = Math.max(amp, E.inQ(prog(t, 4.95, 6.65)) * (t < 6.7 ? 5 : 0)); // charge rumble
  shakeEl.style.transform = amp > 0.05 ? `translate(${noise1(t * 40, 7) * amp}px, ${noise1(t * 43, 8) * amp}px)` : "";
  // film grain crawl
  const fr = Math.floor(t * 24);
  grain.style.backgroundPosition = `${Math.floor(hash(fr) * 256)}px ${Math.floor(hash(fr + 99) * 256)}px`;
  // watermark
  place(wm, 1760, 1030, { o: win(t, 2.6, 25.0, 0.4, 0.2) * 0.8 });
  // fade out
  document.getElementById("stage").style.filter = t > 29.7 ? `brightness(${1 - prog(t, 29.7, 30)})` : "";
}

// ============================================================ RENDER =====
function renderFrame(t) {
  const [pos, look] = camAt(t);
  camera.position.set(...pos);
  camera.lookAt(...look);
  camera.updateMatrixWorld();
  const states = boxesAt(t);
  boxes.forEach((b, i) => b.pose(states[i]));
  // light spilling from the opening box
  glow.intensity = t >= 6.6 && t < 9 ? 12 * win(t, 6.6, 9, 0.15, 0.8) : 0;
  glow.position.set(0, BOX_H * 1.4, 0.3);
  renderer.render(gl3, camera);
  drawFx(t);
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.root.style.display = s.root.back.style.display = on ? "block" : "none";
    if (on) s.update(t, s.ctx);
  }
  globals(t);
}
window.renderFrame = renderFrame;

// ---- ready: fonts, images, first frame --------------------------------------
async function ready() {
  await document.fonts.load("100px Anton");
  await Promise.all([400, 500, 600, 700, 800, 900].map((w) => document.fonts.load(`${w} 20px Inter`)));
  await document.fonts.ready;
  const imgs = [...document.images];
  await Promise.all(imgs.map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = i.onerror = r; }))));
  await Promise.all(imgs.map((i) => i.decode().catch(() => {})));
  // warm every scene once so layout/decode costs are paid before capture
  for (let t = 0; t < DURATION; t += 0.5) renderFrame(t);
  renderFrame(0);
}
const gli = renderer.getContext();
window.__glInfo = gli.getParameter(gli.getExtension("WEBGL_debug_renderer_info")?.UNMASKED_RENDERER_WEBGL ?? gli.RENDERER);
window.__ready = ready();

// ---- interactive scrubbing when opened directly ----------------------------
if (!navigator.webdriver) {
  const fit = () => {
    const s = Math.min(innerWidth / W, innerHeight / H);
    document.getElementById("stage").style.transform = `scale(${s})`;
  };
  addEventListener("resize", fit); fit();
  let t = parseFloat(new URLSearchParams(location.search).get("t") || "0"), playing = !new URLSearchParams(location.search).has("t"), last = null;
  const scrub = document.getElementById("scrub");
  addEventListener("keydown", (e) => {
    if (e.key === " ") playing = !playing;
    if (e.key === "ArrowRight") t += e.shiftKey ? 1 : 1 / 60;
    if (e.key === "ArrowLeft") t -= e.shiftKey ? 1 : 1 / 60;
  });
  window.__ready.then(() => {
    const tick = (now) => {
      if (playing && last != null) t += (now - last) / 1000;
      last = now;
      if (t >= DURATION) t = 0;
      t = clamp(t, 0, DURATION - 1e-3);
      renderFrame(t);
      scrub.textContent = `${t.toFixed(2)}s  —  space: play/pause · ←/→ frame · shift: 1s`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
} else {
  document.body.classList.add("render");
}
</script>
